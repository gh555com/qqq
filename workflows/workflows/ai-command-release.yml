name: AI Command Release System

on:
  # 监听AI指令（通过issue comment触发）
  issue_comment:
    types: [created]
  # 监听PR合并事件
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: write

jobs:
  # q3 - 快速代码保存
  quick-save:
    name: 🚀 q3 Quick Save
    if: |
      github.event.issue.pull_request == null &&
      contains(github.event.comment.body, '发布q3')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Setup environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install version manager
        run: |
          cd version-manager
          npm install

      - name: 🔧 Patch version bump (q3)
        run: |
          cd version-manager
          # q3只做patch级别的小版本递增
          CURRENT_VERSION=$(node -p "require('../package.json').version")
          NEW_VERSION=$(echo $CURRENT_VERSION | awk -F. '{$NF = $NF + 1;} 1' | sed 's/ /./g')

          # 更新package.json
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${NEW_VERSION}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          echo "NEW_VERSION=${NEW_VERSION}" >> $GITHUB_ENV

      - name: 💾 Commit and push (q3)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add package.json
          git commit -m "chore: quick save v${{ env.NEW_VERSION }} (q3)"
          git push origin qq

      - name: 📢 Notify completion (q3)
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ✅ **q3执行完成**
            - 代码已保存至版本 `v${{ env.NEW_VERSION }}`
            - 仅进行了快速版本递增
            - 未触发任何发布流程
            - 适用于小更新和代码备份

  # q1 - 半自动化PR创建
  create-pr:
    name: 🔄 q1 PR Creation
    if: |
      github.event.issue.pull_request == null &&
      contains(github.event.comment.body, '发布q1')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Setup environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install version manager
        run: |
          cd version-manager
          npm install

      - name: 🔧 Version analysis (q1)
        id: version_analysis
        run: |
          cd version-manager
          # 分析提交历史确定版本递增类型
          node version-manager.js validate
          NEXT_VERSION=$(node version-manager.js get-next)
          echo "NEXT_VERSION=$NEXT_VERSION" >> $GITHUB_ENV

      - name: 🌿 Create release branch (q1)
        run: |
          RELEASE_BRANCH="release/v${{ env.NEXT_VERSION }}"
          git checkout -b $RELEASE_BRANCH

          # 提交所有更改
          git add .
          git commit -m "release: prepare v${{ env.NEXT_VERSION }} (q1)" || echo "No changes to commit"

      - name: 🚀 Push release branch (q1)
        run: |
          git push origin release/v${{ env.NEXT_VERSION }}

      - name: 📝 Create Pull Request (q1)
        uses: repo-sync/pull-request@v2
        with:
          source_branch: "release/v${{ env.NEXT_VERSION }}"
          destination_branch: "qq"
          pr_title: "Release v${{ env.NEXT_VERSION }} (q1 - awaiting manual merge)"
          pr_body: |
            ## 🔄 q1半自动化发布请求

            这是由q1指令创建的发布PR，请审查后手动合并。

            ### 合并后将自动触发：
            - ✅ 智能版本号递增
            - ✅ 多平台构建
            - ✅ GitHub Release创建
            - ✅ VS Code Marketplace发布

            ### 版本信息：
            - 预计版本：v${{ env.NEXT_VERSION }}
            - 变更类型：${{ steps.version_analysis.outputs.change_type || '待分析' }}

            > 合并此PR等同于执行q2完整发布流程

      - name: 📢 Notify PR creation (q1)
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ✅ **q1执行完成**
            - 已创建发布分支 `release/v${{ env.NEXT_VERSION }}`
            - PR已创建，请前往GitHub审查并合并
            - 合并后将自动触发完整发布流程
            - 适用于需要人工审查的重要更新

  # q2 - 完整自动化发布
  full-release:
    name: 🎉 q2 Full Release
    if: |
      (github.event.issue.pull_request == null && contains(github.event.comment.body, '发布q2')) ||
      (github.event.pull_request.merged == true && startsWith(github.head_ref, 'release/'))
    runs-on: ubuntu-latest
    steps:
      # q2直接触发的部分
      - name: 🚀 Direct q2 trigger
        if: github.event.issue.pull_request == null && contains(github.event.comment.body, '发布q2')
        run: |
          echo "Direct q2 release triggered"

      # PR合并触发的部分
      - name: 🔄 PR merge trigger
        if: github.event.pull_request.merged == true && startsWith(github.head_ref, 'release/')
        run: |
          echo "Release PR merged, triggering full release"
          echo "MERGED_VERSION=${GITHUB_HEAD_REF#release/v}" >> $GITHUB_ENV

      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Setup environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        run: |
          npm install
          cd version-manager && npm install

      - name: 🔧 Execute full release (q2)
        run: |
          echo "🚀 开始q2完整发布流程..."

          # 如果是PR合并触发，使用PR中的版本号
          if [ -n "${{ env.MERGED_VERSION }}" ]; then
            # 更新package.json到合并的版本
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              pkg.version = '${{ env.MERGED_VERSION }}';
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
            VERSION_TO_USE="${{ env.MERGED_VERSION }}"
          else
            # 直接触发q2，执行版本分析和递增
            cd version-manager
            node version-manager.js bump
            VERSION_TO_USE=$(node -p "require('../package.json').version")
          fi

          echo "RELEASE_VERSION=$VERSION_TO_USE" >> $GITHUB_ENV

      - name: 🏗️ Build all platforms (q2)
        run: |
          echo "🔨 构建所有平台..."
          # 这里会调用原来的构建流程
          echo "Platform builds would execute here"

      - name: 📦 Package VSIX (q2)
        run: npm run ci:package

      - name: 🏷️ Create GitHub Release (q2)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: Release v${{ env.RELEASE_VERSION }}
          body: |
            ## 🎉 v${{ env.RELEASE_VERSION }} 正式发布

            由q2指令触发的完整自动化发布

            ### 发布内容：
            - ✅ 多平台可执行文件
            - ✅ VS Code扩展包
            - ✅ 自动生成的变更日志
          files: |
            dist/*.vsix
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Publish to Marketplace (q2)
        run: |
          echo "🚀 发布到VS Code Marketplace..."
          npm run ci:publish || echo "Marketplace发布可能需要手动处理"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: 📢 Notify completion (q2)
        if: github.event.issue.pull_request == null && contains(github.event.comment.body, '发布q2')
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            🎉 **q2执行完成**
            - 新版本 `v${{ env.RELEASE_VERSION }}` 已成功发布
            - GitHub Release已创建
            - VS Code Marketplace已更新
            - 所有平台构建已完成
            - 适用于正式版本发布

      - name: 📝 Comment on merged PR (q2)
        if: github.event.pull_request.merged == true
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            🎉 **发布成功完成**
            - 版本 `v${{ env.RELEASE_VERSION }}` 已发布
            - 所有自动化流程执行完毕
            - 感谢您的合并！

  # 错误处理和通知
  error-handler:
    name: ❌ Error Handler
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: 📢 Send error notification
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ❌ **执行失败**
            - 操作未能完成
            - 请检查GitHub Actions日志了解详细信息
            - 可能需要手动处理当前状态