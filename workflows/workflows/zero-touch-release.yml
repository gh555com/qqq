name: Zero-Touch Auto Release

on:
  push:
    branches:
      - qq

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  # ==========================================
  # 第一阶段：多平台构建 Rust 二进制
  # ==========================================
  build-rust:
    name: 🏗️ Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset_name: q_linux_x64
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            asset_name: q_win_x64.exe
            target: x86_64-pc-windows-msvc
          - os: windows-2022
            asset_name: q_win_x86.exe
            target: i686-pc-windows-msvc
          - os: windows-2022
            asset_name: q_win_arm64.exe
            target: aarch64-pc-windows-msvc
          - os: macos-14
            asset_name: q_mac_x64
            target: x86_64-apple-darwin
          - os: macos-14
            asset_name: q_mac_arm64
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libcairo2-dev libpango1.0-dev libgdk-pixbuf2.0-dev libgtk-3-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust binary
        shell: bash
        run: |
          cd rust
          if [[ "${{ matrix.os }}" == *"windows"* ]]; then
            cp Cargo_win.toml Cargo.toml
            rustup target add ${{ matrix.target }}
            cargo build --release --target ${{ matrix.target }}
            cp target/${{ matrix.target }}/release/q.exe ../${{ matrix.asset_name }}
          else
            rustup target add ${{ matrix.target }}
            cargo build --release --target ${{ matrix.target }}
            cp target/${{ matrix.target }}/release/q ../${{ matrix.asset_name }}
            chmod +x ../${{ matrix.asset_name }}
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  # ==========================================
  # 第二阶段：智能版本分析 + 汇总 + 打包 VSIX
  # ==========================================
  auto-release:
    name: 🚀 Zero-Touch Auto Release
    needs: build-rust
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. 下载所有平台的 Rust 产物
      - name: 📥 Download all Rust artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      # 3. 设置环境
      - name: ⚙️ Setup environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 4. 安装依赖 + FFmpeg 跨平台二进制
      - name: 📦 Install dependencies
        run: |
          npm install
          # 使用 --force 绕过平台检查，并显式锁定每一个平台二进制包的版本
          npm install \
            @ffmpeg-installer/win32-x64@4.1.0 \
            @ffmpeg-installer/win32-ia32@4.1.0 \
            @ffmpeg-installer/linux-x64@4.1.0 \
            @ffmpeg-installer/linux-arm64@4.1.4 \
            @ffmpeg-installer/darwin-x64@4.1.0 \
            @ffmpeg-installer/darwin-arm64@4.1.5 \
            --no-save --force
          cd version-manager && npm install

      # 5. 智能版本分析
      - name: 📊 Analyze commits and bump version
        id: version_bump
        run: |
          cd version-manager
          echo "Analyzing commits for version bump..."

          # 获取上次发布的提交范围
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -n "$LAST_TAG" ]; then
            COMMIT_RANGE="${LAST_TAG}..HEAD"
          else
            COMMIT_RANGE="HEAD"
          fi

          # 分析提交类型
          COMMITS=$(git log --oneline $COMMIT_RANGE | wc -l)
          FEAT_COMMITS=$(git log --oneline $COMMIT_RANGE | grep -c "^feat:" || echo "0")
          FIX_COMMITS=$(git log --oneline $COMMIT_RANGE | grep -c "^fix:" || echo "0")
          BREAKING=$(git log --oneline $COMMIT_RANGE | grep -ci "breaking" || echo "0")

          echo "📊 Analysis results:"
          echo "  Total commits: $COMMITS"
          echo "  Feature commits: $FEAT_COMMITS"
          echo "  Fix commits: $FIX_COMMITS"
          echo "  Breaking changes: $BREAKING"

          # 确定版本递增类型
          if [ "$BREAKING" -gt 0 ]; then
            BUMP_TYPE="major"
          elif [ "$FEAT_COMMITS" -gt 0 ]; then
            BUMP_TYPE="minor"
          elif [ "$FIX_COMMITS" -gt 0 ]; then
            BUMP_TYPE="patch"
          else
            BUMP_TYPE="none"
          fi

          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT

          if [ "$BUMP_TYPE" != "none" ]; then
            # 执行版本递增
            NEW_VERSION=$(node version-manager.js get-next)
            node version-manager.js bump
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "✅ Version bumped to $NEW_VERSION"
          else
            CURRENT_VERSION=$(node -p "require('./package.json').version")
            echo "new_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            echo "ℹ️ No changes detected, skipping version bump"
          fi

      # 6. 打包 VSIX + 嵌入 FFmpeg
      - name: 📦 Create VSIX packages with FFmpeg
        if: steps.version_bump.outputs.bump_type != 'none'
        run: |
          node git_help.js package

      # 7. 创建 GitHub Release
      - name: 🏷️ Create GitHub Release
        if: steps.version_bump.outputs.bump_type != 'none'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version_bump.outputs.new_version }}
          name: Release v${{ steps.version_bump.outputs.new_version }}
          files: |
            assets/q_linux_x64
            assets/q_win_x64.exe
            assets/q_win_x86.exe
            assets/q_win_arm64.exe
            assets/q_mac_x64
            assets/q_mac_arm64
            dist/*.vsix
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 8. 发布到 VS Code Marketplace
      - name: 📦 Publish to VS Code Marketplace
        if: steps.version_bump.outputs.bump_type != 'none'
        run: |
          echo "🚀 Publishing to VS Code Marketplace..."
          npm run ci:publish || echo "⚠️ Marketplace publish failed, but release created"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # 9. 推送版本变更
      - name: 🔄 Push version changes
        if: steps.version_bump.outputs.bump_type != 'none'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git push origin qq --follow-tags

      # 10. 发送通知
      - name: 📢 Send notifications
        if: always()
        run: |
          if [ "${{ steps.version_bump.outputs.bump_type }}" != "none" ]; then
            echo "🎉 成功发布新版本 v${{ steps.version_bump.outputs.new_version }}!"
            echo "📦 已构建所有平台并发布到GitHub和VS Code Marketplace"
          else
            echo "ℹ️ 检测到无实质性变更，跳过发布流程"
          fi