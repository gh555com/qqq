[package]
name = "ghrun"
version = "0.1.0"
edition = "2021"
description = "qqq IDE component manager and goods installer"

[[bin]]
name = "ghrun"
path = "src/main.rs"

[[bin]]
name = "watchdog"
path = "src/bin/watchdog.rs"

[profile.release]
strip = true
lto = true
panic = "abort"
codegen-units = 1

[dependencies]
clap    = { version = "4", features = ["derive"] }
serde   = { version = "1", features = ["derive"] }
serde_json = "1"
sha2    = "0.10"
hex     = "0.4"
zip     = { version = "0.6", default-features = false, features = ["deflate"] }
flate2  = "1"
tar     = "0.4"
# blocking HTTP — avoids tokio dependency, keeps binary small
reqwest = { version = "0.11", default-features = false, features = ["blocking", "native-tls"] }
once_cell = "1"
