name: publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write  # 需要创建 GitHub Release

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm install

      # 设置 Rust 编译环境
      - name: Set up Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-gnu
          override: true
          components: rustfmt, clippy

      # 安装交叉编译依赖（用于编译 Windows 版本）
      - name: Install cross-compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      # 编译 Rust 引擎
      - name: Build Rust daemon
        run: |
          cd rust
          bash build.sh

      # 验证编译结果
      - name: Verify Rust binaries built
        run: |
          ls -la assets/
          file assets/q_*

      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          test "$TAG" = "$PKG"

      - name: Package VSIX
        run: npm run ci:package

      - name: Verify VSIX file exists
        run: |
          ls -la dist/
          file dist/*.vsix

      - name: Create GitHub Release (auto notes) and upload VSIX
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.vsix
            assets/q_*

      - name: Publish to VS Code Marketplace
        run: npm run ci:publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        continue-on-error: true  # 即使Marketplace发布失败，也继续执行


