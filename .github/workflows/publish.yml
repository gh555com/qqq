name: publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write  # 需要创建 GitHub Release

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm install

      # 设置 Rust 编译环境
      - name: Set up Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-gnu
          override: true
          components: rustfmt, clippy

      # 安装交叉编译依赖（用于编译 Windows 版本）
      - name: Install cross-compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      # 编译 Rust 引擎
      - name: Build Rust daemon
        run: |
          # 添加调试信息
          echo "Current directory: $(pwd)"
          echo "Rust version: $(cargo --version)"
          echo "Rustc version: $(rustc --version)"

          # 进入rust目录
          cd rust
          echo "In rust directory: $(pwd)"

          # 显示目录内容
          echo "Rust directory contents:"
          ls -la

          # 显示Cargo配置
          echo "Cargo.toml content:"
          cat Cargo.toml

          # 编译Rust代码
          echo "Building Linux x64..."
          cargo build --release --target x86_64-unknown-linux-gnu --verbose

          # 检查编译结果
          if [ $? -eq 0 ]; then
            echo "Compilation successful!"

            # 确保assets目录存在
            mkdir -p ../assets

            # 复制编译好的二进制文件
            echo "Copying binary file..."
            ls -la target/x86_64-unknown-linux-gnu/release/
            cp target/x86_64-unknown-linux-gnu/release/q ../assets/q_linux_x64
            chmod +x ../assets/q_linux_x64

            # 显示编译结果
            echo "Final assets directory:"
            ls -la ../assets/
          else
            echo "Compilation failed!"
            exit 1
          fi

      # 验证编译结果（暂时跳过）
      - name: Verify Rust binaries built
        run: |
          ls -la assets/
          file assets/q_*

      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          test "$TAG" = "$PKG"

      - name: Package VSIX
        run: npm run ci:package

      - name: Verify VSIX file exists
        run: |
          ls -la dist/
          file dist/*.vsix

      - name: Create GitHub Release and upload files
        run: |
          # 安装jq工具（用于解析JSON响应）
          sudo apt-get install -y jq

          # 获取版本号
          VERSION="${{ github.ref_name }}"

          # 显示当前目录和文件
          echo "Current directory: $(pwd)"
          ls -la dist/
          ls -la assets/

          # 创建Release
          echo "Creating Release $VERSION..."
          RELEASE_ID=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/gh555com/qqq/releases \
            -d '{"tag_name":"'$VERSION'","name":"'$VERSION'","generate_release_notes":true}' \
            | jq -r '.id')

          echo "Release ID: $RELEASE_ID"

          # 上传VSIX文件
          VSIX_FILE=$(ls dist/*.vsix)
          echo "Uploading $VSIX_FILE..."
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$VSIX_FILE" \
            "https://uploads.github.com/repos/gh555com/qqq/releases/$RELEASE_ID/assets?name=$(basename $VSIX_FILE)"

          # 上传Rust二进制文件
          for BINARY in assets/q_*; do
            echo "Uploading $BINARY..."
            curl -s -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$BINARY" \
              "https://uploads.github.com/repos/gh555com/qqq/releases/$RELEASE_ID/assets?name=$(basename $BINARY)"
          done

      - name: Publish to VS Code Marketplace
        run: npm run ci:publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        continue-on-error: true  # 即使Marketplace发布失败，也继续执行


