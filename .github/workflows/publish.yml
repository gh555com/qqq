name: publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write  # 需要创建 GitHub Release

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Test
        run: npm run ci:test

      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          test "$TAG" = "$PKG"

      - name: Package VSIX
        run: npm run ci:package

      - name: Verify VSIX file exists
        run: |
          ls -la dist/
          file dist/*.vsix

      - name: Publish to VS Code Marketplace
        run: npm run ci:publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Create GitHub Release (auto notes) and upload VSIX
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create release with all VSIX files
          VSIX_FILES=$(ls dist/*.vsix)
          echo "Uploading VSIX files: $VSIX_FILES"
          gh release create "${GITHUB_REF_NAME}" $VSIX_FILES \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

      - name: Update CHANGELOG with release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create or update CHANGELOG.md
          if [ ! -f CHANGELOG.md ]; then
            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "All notable changes to this project will be documented in this file." >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "## 变更日志" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "本项目所有重要变更将在此文件中记录。" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
          fi

          # Get release notes from GitHub
          RELEASE_NOTES=$(gh release view "${GITHUB_REF_NAME}" --json body --jq .body)

          # Add new release to the top of CHANGELOG
          TEMP_FILE=$(mktemp)
          echo "## ${GITHUB_REF_NAME} ($(date +'%Y-%m-%d'))" > $TEMP_FILE
          echo "" >> $TEMP_FILE
          echo "${RELEASE_NOTES}" >> $TEMP_FILE
          echo "" >> $TEMP_FILE
          cat CHANGELOG.md >> $TEMP_FILE
          mv $TEMP_FILE CHANGELOG.md
