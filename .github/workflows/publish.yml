name: publish

on:
  workflow_dispatch:
  push:
    branches:
      - qq
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-rust:
    name: Build Rust for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux: 使用Ubuntu 20.04 LTS获得最大兼容性
          - os: ubuntu-20.04
            asset_name: q_linux_x64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-20.04
            asset_name: q_linux_arm64
            target: aarch64-unknown-linux-gnu

          # Windows: 使用Windows 2022但保持向下兼容
          - os: windows-2022
            asset_name: q_win_x64.exe
            target: x86_64-pc-windows-msvc
          - os: windows-2022
            asset_name: q_win_x86.exe
            target: i686-pc-windows-msvc
                    
          # macOS: 使用macOS 14平衡兼容性和可用性
          - os: macos-14
            asset_name: q_mac_x64
            target: x86_64-apple-darwin
          - os: macos-14
            asset_name: q_mac_arm64
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libcairo2-dev libpango1.0-dev libgdk-pixbuf2.0-dev libgtk-3-dev
          # For ARM64 cross-compilation
          if [ "${{ matrix.asset_name }}" == "q_linux_arm64" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            # Install ARM64 sysroot (minimal approach)
            sudo apt-get install -y debootstrap
            sudo debootstrap --arch=arm64 noble /tmp/arm64-sysroot http://ports.ubuntu.com/ubuntu-ports
            # Set up pkg-config for cross-compilation
            sudo mkdir -p /usr/lib/aarch64-linux-gnu/pkgconfig
            sudo ln -sf /tmp/arm64-sysroot/usr/lib/aarch64-linux-gnu/pkgconfig/* /usr/lib/aarch64-linux-gnu/pkgconfig/
          fi

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust binary
        shell: bash
        run: |
          cd rust
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            # Windows: copy Cargo_win.toml to Cargo.toml and build
            cp Cargo_win.toml Cargo.toml
            # Windows: 统一使用指定target构建
            rustup target add ${{ matrix.target }}
            cargo build --release --target ${{ matrix.target }}
            cp target/${{ matrix.target }}/release/q.exe ../${{ matrix.asset_name }}
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            # macOS: build for both architectures
            # macOS: 统一使用指定target构建
            rustup target add ${{ matrix.target }}
            cargo build --release --target ${{ matrix.target }}
            cp target/${{ matrix.target }}/release/q ../${{ matrix.asset_name }}
            chmod +x ../${{ matrix.asset_name }}
          else
            # Linux: build for different architectures
            # Linux: 使用Ubuntu 20.04确保广泛兼容性
            rustup target add ${{ matrix.target }}
            if [ "${{ matrix.asset_name }}" == "q_linux_arm64" ]; then
              # ARM64交叉编译配置
              export PKG_CONFIG_ALLOW_CROSS=1
              export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig
              export PKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu
              export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
              export CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++
            fi
            cargo build --release --target ${{ matrix.target }}
            cp target/${{ matrix.target }}/release/q ../${{ matrix.asset_name }}
            chmod +x ../${{ matrix.asset_name }}
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    needs: build-rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Package VSIX
        run: npm run ci:package

      - name: Get version
        id: get_version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            VERSION="v$(node -p "require('./package.json').version")-$(date +%Y%m%d-%H%M%S)"
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          files: |
            assets/qqq-*.vsix
            assets/q_linux_x64
            assets/q_linux_arm64
            assets/q_mac_x64
            assets/q_mac_arm64
            assets/q_win_x64.exe
            assets/q_win_x86.exe
            dist/*.vsix
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to VS Code Marketplace
        if: success()
        run: npm run ci:publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
