name: publish

on:
  workflow_dispatch:
  push:
    branches:
      - qq
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-rust:
    name: Build Rust for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: q_linux_x64
          - os: ubuntu-latest
            asset_name: q_linux_arm64
          - os: windows-latest
            asset_name: q_win_x64.exe
          - os: windows-latest
            asset_name: q_win_x86.exe
          - os: macos-latest
            asset_name: q_mac_x64
          - os: macos-latest
            asset_name: q_mac_arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libcairo2-dev libpango1.0-dev libgdk-pixbuf2.0-dev libgtk-3-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust binary
        shell: bash
        run: |
          cd rust
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            # Windows: copy Cargo_win.toml to Cargo.toml and build
            cp Cargo_win.toml Cargo.toml
            if [ "${{ matrix.asset_name }}" == "q_win_x86.exe" ]; then
              # 32-bit Windows
              rustup target add i686-pc-windows-msvc
              cargo build --release --target i686-pc-windows-msvc
              cp target/i686-pc-windows-msvc/release/q.exe ../${{ matrix.asset_name }}
            else
              # 64-bit Windows
              cargo build --release
              cp target/release/q.exe ../${{ matrix.asset_name }}
            fi
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            # macOS: build for both architectures
            if [ "${{ matrix.asset_name }}" == "q_mac_arm64" ]; then
              # Apple Silicon (ARM64)
              rustup target add aarch64-apple-darwin
              cargo build --release --target aarch64-apple-darwin
              cp target/aarch64-apple-darwin/release/q ../${{ matrix.asset_name }}
            else
              # Intel Mac (x86_64)
              rustup target add x86_64-apple-darwin
              cargo build --release --target x86_64-apple-darwin
              cp target/x86_64-apple-darwin/release/q ../${{ matrix.asset_name }}
            fi
            chmod +x ../${{ matrix.asset_name }}
          else
            # Linux: build for different architectures
            if [ "${{ matrix.asset_name }}" == "q_linux_arm64" ]; then
              # ARM64 Linux
              rustup target add aarch64-unknown-linux-gnu
              cargo build --release --target aarch64-unknown-linux-gnu
              cp target/aarch64-unknown-linux-gnu/release/q ../${{ matrix.asset_name }}
            else
              # x86_64 Linux
              rustup target add x86_64-unknown-linux-gnu
              cargo build --release --target x86_64-unknown-linux-gnu
              cp target/x86_64-unknown-linux-gnu/release/q ../${{ matrix.asset_name }}
            fi
            chmod +x ../${{ matrix.asset_name }}
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    needs: build-rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Package VSIX
        run: npm run ci:package

      - name: Get version
        id: get_version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            VERSION="v$(node -p "require('./package.json').version")-$(date +%Y%m%d-%H%M%S)"
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          files: |
            assets/qqq-*.vsix
            assets/q_linux_x64
            assets/q_linux_arm64
            assets/q_mac_x64
            assets/q_mac_arm64
            assets/q_win_x64.exe
            assets/q_win_x86.exe
            dist/*.vsix
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to VS Code Marketplace
        if: success()
        run: npm run ci:publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
