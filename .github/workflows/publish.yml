name: 🚀 Full-Stack Release System (q1/q2)

on:
  push:
    branches:
      - qq
  workflow_dispatch:

# 只有 q2 发布才触发完整构建
# q3 快速保存会被跳过

jobs:
  # 检查是否需要构建
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Check commit message
        id: check
        run: |
          MSG="${{ github.event.head_commit.message }}"
          if [[ "$MSG" == *"(q2)"* ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "✅ q2 发布，触发完整构建"
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "⚡ q3 快速保存，跳过构建"
          fi

  build-rust:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: q_linux_x64
            target: x86_64-unknown-linux-gnu
          # Windows 暂时禁用，待修复
          # - os: windows-2022
          #   asset: q_win_x64.exe
          #   target: x86_64-pc-windows-msvc
          - os: macos-14
            asset: q_mac_x64
            target: x86_64-apple-darwin
          - os: macos-14
            asset: q_mac_arm64
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libcairo2-dev libpango1.0-dev libgdk-pixbuf2.0-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        shell: bash
        run: |
          cd rust
          if [[ "${{ matrix.os }}" == *"windows"* ]]; then
            cp Cargo_win.toml Cargo.toml
          fi
          rustup target add ${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }}
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp target/${{ matrix.target }}/release/q.exe ../${{ matrix.asset }}
          else
            cp target/${{ matrix.target }}/release/q ../${{ matrix.asset }}
            chmod +x ../${{ matrix.asset }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: [check, build-rust]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run bundle
      - name: Package all platforms
        run: |
          mkdir -p dist
          rm -rf assets/runtimes/x86
          npx @vscode/vsce package --target win32-x64 -o dist/qqq-win32-x64.vsix --allow-missing-repository --allow-star-activation
          git checkout assets/runtimes/x86 2>/dev/null || true
          rm -rf assets/runtimes/x64
          npx @vscode/vsce package --target win32-ia32 -o dist/qqq-win32-ia32.vsix --allow-missing-repository --allow-star-activation
          git checkout assets/runtimes/x64 2>/dev/null || true
          rm -rf assets/runtimes
          npx @vscode/vsce package --target linux-x64 -o dist/qqq-linux-x64.vsix --allow-missing-repository --allow-star-activation
          npx @vscode/vsce package --target darwin-x64 -o dist/qqq-darwin-x64.vsix --allow-missing-repository --allow-star-activation
          npx @vscode/vsce package --target darwin-arm64 -o dist/qqq-darwin-arm64.vsix --allow-missing-repository --allow-star-activation
          git checkout assets/runtimes 2>/dev/null || true
      - name: Get version
        id: ver
        run: echo "VERSION=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.VERSION }}
          name: Release ${{ steps.ver.outputs.VERSION }}
          files: |
            dist/*.vsix
            assets/q_*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to Marketplace
        run: |
          npx @vscode/vsce publish --packagePath dist/qqq-win32-x64.vsix --allow-missing-repository --allow-star-activation || true
          npx @vscode/vsce publish --packagePath dist/qqq-win32-ia32.vsix --allow-missing-repository --allow-star-activation || true
          npx @vscode/vsce publish --packagePath dist/qqq-linux-x64.vsix --allow-missing-repository --allow-star-activation || true
          npx @vscode/vsce publish --packagePath dist/qqq-darwin-x64.vsix --allow-missing-repository --allow-star-activation || true
          npx @vscode/vsce publish --packagePath dist/qqq-darwin-arm64.vsix --allow-missing-repository --allow-star-activation || true
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
