name: Rust Win7 Compatibility Check

on:
  push:
    branches: [qq]
    paths:
      - 'rust/**'
      - '.github/workflows/rust-win7-check.yml'
  workflow_dispatch:

jobs:
  build-and-check:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (nightly for build-std + win7 target)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Build Release with Win7 target
        shell: bash
        run: |
          cd rust
          cp Cargo_win.toml Cargo.toml
          # ★ 使用官方 Win7 专用目标 x86_64-win7-windows-msvc
          # 这个目标的 baseline 是 Win7，标准库不会使用 Win8+ API
          RUSTFLAGS="-C target-feature=+crt-static" cargo +nightly build --release \
            --target x86_64-win7-windows-msvc \
            -Z build-std=std,panic_abort \
            2>&1 | tee ../build_log.txt || true
          ls -lh target/x86_64-win7-windows-msvc/release/q.exe 2>&1 || echo "Build failed"

      - name: Setup MSVC for dumpbin
        uses: ilammy/msvc-dev-cmd@v1

      - name: Check File Size
        shell: bash
        run: |
          ls -lh rust/target/x86_64-win7-windows-msvc/release/q.exe || echo "No exe"

      - name: Dump Imports
        shell: cmd
        run: |
          echo === IMPORTS === > dumpbin_output.txt
          dumpbin /imports rust\target\x86_64-win7-windows-msvc\release\q.exe >> dumpbin_output.txt
          type dumpbin_output.txt

      - name: Check for Win10+ APIs
        shell: pwsh
        run: |
          $output = Get-Content dumpbin_output.txt -Raw
          $win10apis = @(
            "WaitOnAddress", "WakeByAddressSingle", "WakeByAddressAll",
            "SetThreadDescription", "GetThreadDescription"
          )
          $found = @()
          foreach ($api in $win10apis) {
            if ($output -match $api) { $found += $api }
          }
          if ($found.Count -gt 0) {
            Write-Host "=== ERROR: Win10+ APIs FOUND ==="
            foreach ($api in $found) { Write-Host "  - $api" }
            Write-Host "Build is NOT Win7 compatible!"
            exit 1
          } else {
            Write-Host "=== SUCCESS: No Win10+ APIs found ==="
            Write-Host "Build should be Win7 compatible!"
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q_win7_x64
          path: |
            rust/target/x86_64-win7-windows-msvc/release/q.exe
            dumpbin_output.txt
            build_log.txt
