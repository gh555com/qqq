name: Rust Win7 Compatibility Check

on:
  push:
    branches: [qq]
    paths:
      - 'rust/**'
      - '.github/workflows/rust-win7-check.yml'
  workflow_dispatch:

jobs:
  build-and-check:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install MinGW
        run: choco install mingw -y

      - name: Build Release with GNU toolchain (Win7 compat)
        shell: bash
        run: |
          cd rust
          cp Cargo_win.toml Cargo.toml
          # Use GNU toolchain instead of MSVC - may avoid WaitOnAddress
          RUSTFLAGS="-C target-feature=+crt-static" cargo build --release --target x86_64-pc-windows-gnu 2>&1 | tee ../build_log.txt || true
          ls -lh target/x86_64-pc-windows-gnu/release/q.exe 2>&1 || echo "Build failed, check build_log.txt"

      - name: Check File Size
        shell: bash
        run: |
          ls -lh rust/target/x86_64-pc-windows-gnu/release/q.exe || echo "No exe found"

      - name: Dump ALL Imports
        shell: bash
        run: |
          echo "=== FULL IMPORT LIST ===" > dumpbin_output.txt
          # Use objdump for GNU builds
          objdump -p rust/target/x86_64-pc-windows-gnu/release/q.exe 2>&1 >> dumpbin_output.txt || echo "objdump failed"
          cat dumpbin_output.txt

      - name: Check for Win10+ APIs
        shell: pwsh
        run: |
          $output = Get-Content dumpbin_output.txt -Raw

          # Known Win10+ APIs that don't exist in Win7
          $win10apis = @(
            "SetThreadDescription",
            "GetThreadDescription",
            "SetProcessMitigationPolicy",
            "GetProcessMitigationPolicy",
            "SetThreadSelectedCpuSets",
            "GetSystemCpuSetInformation",
            "WaitOnAddress",
            "WakeByAddressSingle",
            "WakeByAddressAll"
          )

          $found = @()
          foreach ($api in $win10apis) {
            if ($output -match $api) {
              $found += $api
            }
          }

          if ($found.Count -gt 0) {
            Write-Host "=== ERROR: Win10+ APIs FOUND ==="
            foreach ($api in $found) {
              Write-Host "  - $api"
            }
            Write-Host ""
            Write-Host "These APIs do NOT exist in Windows 7!"
            Write-Host "Build is NOT Win7 compatible!"
            exit 1
          } else {
            Write-Host "=== SUCCESS: No Win10+ APIs found ==="
            Write-Host "Build is Win7 compatible!"
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q_win_x64_gnu
          path: |
            rust/target/x86_64-pc-windows-gnu/release/q.exe
            dumpbin_output.txt
            build_log.txt
