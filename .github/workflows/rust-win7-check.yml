name: Rust Win7 Compatibility Check

on:
  workflow_dispatch:

jobs:
  build-and-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust 1.77 (last Win7 compatible)
        uses: dtolnay/rust-action@stable
        with:
          toolchain: 1.77.0

      - name: Prepare Cargo.toml
        run: |
          cd rust
          copy Cargo_win.toml Cargo.toml

      - name: Build Release
        run: |
          cd rust
          cargo build --release
          dir target\release\*.exe

      - name: Check File Size
        run: |
          $file = "rust/target/release/q.exe"
          $size = (Get-Item $file).Length
          $sizeMB = [math]::Round($size / 1MB, 2)
          Write-Host "=== FILE SIZE: $sizeMB MB ==="

      - name: Dump Imports (API Check)
        run: |
          Write-Host "=== KERNEL32.DLL IMPORTS ==="
          dumpbin /imports rust/target/release/q.exe | Select-String -Pattern "kernel32|KERNEL32" -Context 0,50

          Write-Host ""
          Write-Host "=== ALL IMPORTS SUMMARY ==="
          dumpbin /imports rust/target/release/q.exe | Select-String -Pattern "\.dll"

      - name: Check for Win10+ APIs
        run: |
          $output = dumpbin /imports rust/target/release/q.exe

          # Known Win10+ APIs that don't exist in Win7
          $win10apis = @(
            "SetThreadDescription",
            "GetThreadDescription",
            "SetProcessMitigationPolicy",
            "GetProcessMitigationPolicy",
            "SetThreadSelectedCpuSets",
            "GetSystemCpuSetInformation",
            "CreateEventExW",
            "WaitOnAddress",
            "WakeByAddressSingle",
            "WakeByAddressAll"
          )

          $found = @()
          foreach ($api in $win10apis) {
            if ($output -match $api) {
              $found += $api
            }
          }

          if ($found.Count -gt 0) {
            Write-Host "=== WARNING: Win10+ APIs FOUND ==="
            foreach ($api in $found) {
              Write-Host "  - $api"
            }
            Write-Host ""
            Write-Host "These APIs do NOT exist in Windows 7!"
          } else {
            Write-Host "=== OK: No known Win10+ APIs found ==="
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: q_win_x64
          path: rust/target/release/q.exe
