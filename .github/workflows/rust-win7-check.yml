name: Rust Win7 Compatibility Check

on:
  push:
    branches: [qq]
    paths:
      - 'rust/**'
      - '.github/workflows/rust-win7-check.yml'
  workflow_dispatch:

jobs:
  build-and-check:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust 1.76 (last Win7 compatible)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.76.0

      - name: Build Release (same as main workflow)
        shell: bash
        run: |
          cd rust
          cp Cargo_win.toml Cargo.toml
          rustup target add x86_64-pc-windows-msvc
          RUSTFLAGS="-C target-feature=+crt-static" cargo build --release --target x86_64-pc-windows-msvc
          ls -lh target/x86_64-pc-windows-msvc/release/q.exe

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Check File Size
        run: |
          $file = "rust/target/x86_64-pc-windows-msvc/release/q.exe"
          $size = (Get-Item $file).Length
          $sizeMB = [math]::Round($size / 1MB, 2)
          Write-Host "=== FILE SIZE: $sizeMB MB ==="

      - name: Dump ALL Imports
        shell: cmd
        run: |
          echo === FULL IMPORT LIST === > dumpbin_output.txt
          dumpbin /imports rust\target\x86_64-pc-windows-msvc\release\q.exe >> dumpbin_output.txt
          type dumpbin_output.txt

      - name: Check for Win10+ APIs
        shell: pwsh
        run: |
          $output = Get-Content dumpbin_output.txt -Raw

          # Known Win10+ APIs that don't exist in Win7
          $win10apis = @(
            "SetThreadDescription",
            "GetThreadDescription",
            "SetProcessMitigationPolicy",
            "GetProcessMitigationPolicy",
            "SetThreadSelectedCpuSets",
            "GetSystemCpuSetInformation",
            "WaitOnAddress",
            "WakeByAddressSingle",
            "WakeByAddressAll"
          )

          $found = @()
          foreach ($api in $win10apis) {
            if ($output -match $api) {
              $found += $api
            }
          }

          if ($found.Count -gt 0) {
            Write-Host "=== WARNING: Win10+ APIs FOUND ==="
            foreach ($api in $found) {
              Write-Host "  - $api"
            }
            Write-Host ""
            Write-Host "These APIs do NOT exist in Windows 7!"
          } else {
            Write-Host "=== OK: No known Win10+ APIs found ==="
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: q_win_x64
          path: |
            rust/target/x86_64-pc-windows-msvc/release/q.exe
            dumpbin_output.txt
