name: 🚀 Full-Stack Release System (q1/q2)

on:
  issue_comment:
    types: [created]
  push:
    branches: [qq, 'release/**']
  pull_request:
    types: [closed]
    branches: [qq]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # ==========================================
  # 1. q1: 创建发布PR
  # ==========================================
  q1-create-pr:
    name: "🔄 q1: Create Release PR"
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && contains(github.event.comment.body, '发布q1')) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect Branch and Version
        id: info
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            BRANCH_NAME=${GITHUB_REF#refs/heads/}
            VERSION_NAME=${BRANCH_NAME#release/v}
            echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
            echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT
            echo "is_push=true" >> $GITHUB_OUTPUT
          else
            CURRENT=$(node -p "require('./package.json').version")
            NEXT=$(echo $CURRENT | awk -F. '{print $1"."($2+1)".0"}')
            echo "branch=release/v$NEXT" >> $GITHUB_OUTPUT
            echo "version=$NEXT" >> $GITHUB_OUTPUT
            echo "is_push=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Release Branch (Comment Only)
        if: steps.info.outputs.is_push == 'false'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b ${{ steps.info.outputs.branch }}
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json')); p.version='${{ steps.info.outputs.version }}'; fs.writeFileSync('package.json', JSON.stringify(p, null, 2)+'\n');"
          git add .
          git commit -m "release: prepare v${{ steps.info.outputs.version }} (q1)"
          git push origin ${{ steps.info.outputs.branch }}

      - uses: repo-sync/pull-request@v2
        with:
          source_branch: ${{ steps.info.outputs.branch }}
          destination_branch: "qq"
          pr_title: "🚀 Release v${{ steps.info.outputs.version }} (q1)"
          pr_body: "此 PR 由 q1 指令自动创建。合并后将触发全平台构建和发布。"

      - name: Notification (Comment Only)
        if: github.event.issue.number && steps.info.outputs.is_push == 'false'
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          body: "✅ **q1 执行成功**！已创建发布分支和 PR。"

  # ==========================================
  # 2. 核心构建 Job (基于满血版 publish.yml)
  # ==========================================
  build-rust:
    name: 🏗️ Build ${{ matrix.target }}
    if: |
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '(q2)') || contains(github.event.head_commit.message, '(q5)') || contains(github.event.head_commit.message, 'Merge pull request'))) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && contains(github.event.comment.body, '发布q2')) ||
      (github.event.name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.head_ref, 'release/'))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ★ 4 架构精简策略 (win_x64, linux_x64, darwin_x64, darwin_arm64)
          - os: ubuntu-22.04
            asset_name: q_linux_x64
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            asset_name: q_win_x64.exe
            target: x86_64-pc-windows-msvc
          - os: macos-14
            asset_name: q_mac_x64
            target: x86_64-apple-darwin
          - os: macos-14
            asset_name: q_mac_arm64
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libcairo2-dev libpango1.0-dev libgdk-pixbuf2.0-dev libgtk-3-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust binary
        shell: bash
        run: |
          cd rust
          if [[ "${{ matrix.os }}" == *"windows"* ]]; then
            cp Cargo_win.toml Cargo.toml
            mkdir -p .cargo
            cat > .cargo/config.toml << 'EOF'
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
EOF
            rustup target add ${{ matrix.target }}
            cargo build --release --target ${{ matrix.target }}
            cp target/${{ matrix.target }}/release/q.exe ../${{ matrix.asset_name }}
          else
            rustup target add ${{ matrix.target }}
            cargo build --release --target ${{ matrix.target }}
            cp target/${{ matrix.target }}/release/q ../${{ matrix.asset_name }}
            chmod +x ../${{ matrix.asset_name }}
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  # ==========================================
  # 3. 发布 Job (汇总产物 + Universal VSIX + Marketplace)
  # ==========================================
  q2-release:
    name: "🚀 q2: Finalize Release"
    needs: build-rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🛡️ Checkout Private Workflow Assets
        uses: actions/checkout@v4
        with:
          repository: kkn1n/qqqworkflow
          token: ${{ secrets.GH_PAT }}
          path: qqqworkflow
          ref: qq

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install

      # ★ 将 4 个 Rust 产物复制到 assets/（Universal 包全部包含）
      - name: Prepare Rust artifacts
        run: |
          echo "📋 Available artifacts:"
          ls -la artifacts/ 2>/dev/null || echo "No artifacts directory"
          cp artifacts/q_* assets/ 2>/dev/null || true
          chmod +x assets/q_linux_x64 assets/q_mac_x64 assets/q_mac_arm64 2>/dev/null || true
          # 移除 x86 DLL（不再支持 win32-ia32）
          rm -rf assets/runtimes/x86
          echo "📋 Assets after copy:"
          ls -la assets/q_* 2>/dev/null || echo "No q_engine binaries found"

      - name: Bundle
        run: |
          npm run bundle
          node -e "require('./qqqworkflow/esbuild.config').transformPackageJsonConfigKeys()"

      # ★ Universal 单包：包含 4 个 q_engine，不注入 FFmpeg（运行时下载）
      - name: Package Universal VSIX
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          npx @vscode/vsce package -o dist/${PKG_NAME}-universal.vsix --allow-missing-repository --allow-star-activation --no-dependencies
          echo "📦 Universal VSIX created:"
          ls -lh dist/*.vsix

      - name: Get version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: Release v${{ steps.get_version.outputs.VERSION }}
          files: |
            assets/q_*
            dist/*.vsix
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to VS Code Marketplace
        if: "!contains(github.event.head_commit.message, '(q5)')"
        run: |
          npx @vscode/vsce publish --packagePath dist/*.vsix --allow-missing-repository --allow-star-activation || echo "Marketplace发布失败，可能是Token过期"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Strip zip extra fields from VSIX (Open VSX requirement)
        if: "!contains(github.event.head_commit.message, '(q5)')"
        run: |
          for vsix in dist/*.vsix; do
            tmpdir=$(mktemp -d)
            unzip -q "$vsix" -d "$tmpdir"
            rm "$vsix"
            (cd "$tmpdir" && zip -X -r "$OLDPWD/$vsix" .)
            rm -rf "$tmpdir"
            echo "✅ Stripped extra fields: $vsix"
          done

      - name: Publish to Open VSX
        if: "!contains(github.event.head_commit.message, '(q5)')"
        run: |
          npm install -g ovsx
          for vsix in dist/*.vsix; do
            pkg_ok=false
            for attempt in 1 2 3; do
              echo "📦 Publishing $vsix (attempt $attempt/3)..."
              if ovsx publish "$vsix" --pat ${{ secrets.OVSX_PAT }}; then
                pkg_ok=true
                break
              fi
              echo "⚠️ Attempt $attempt failed, waiting 15s before retry..."
              sleep 15
            done
            if [ "$pkg_ok" = false ]; then
              echo "❌ Open VSX publish $vsix failed after 3 attempts"
              echo "::warning::Open VSX 发布失败: $vsix"
            fi
          done
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Feedback
        if: github.event.issue.number
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          body: "🎉 **q2 发布成功**！版本 v${{ steps.get_version.outputs.VERSION }} Universal 包已发布到 Marketplace 和 Open VSX。"
