name: 🚀 Full-Stack Release System (q1/q2)

on:
  issue_comment:
    types: [created]
  push:
    branches: [qq, 'release/**']
  pull_request:
    types: [closed]
    branches: [qq]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # ==========================================
  # 1. q1: 创建发布PR
  # ==========================================
  q1-create-pr:
    name: "🔄 q1: Create Release PR"
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && contains(github.event.comment.body, '发布q1')) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect Branch and Version
        id: info
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            BRANCH_NAME=${GITHUB_REF#refs/heads/}
            VERSION_NAME=${BRANCH_NAME#release/v}
            echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
            echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT
            echo "is_push=true" >> $GITHUB_OUTPUT
          else
            CURRENT=$(node -p "require('./package.json').version")
            NEXT=$(echo $CURRENT | awk -F. '{print $1"."($2+1)".0"}')
            echo "branch=release/v$NEXT" >> $GITHUB_OUTPUT
            echo "version=$NEXT" >> $GITHUB_OUTPUT
            echo "is_push=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Release Branch (Comment Only)
        if: steps.info.outputs.is_push == 'false'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b ${{ steps.info.outputs.branch }}
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json')); p.version='${{ steps.info.outputs.version }}'; fs.writeFileSync('package.json', JSON.stringify(p, null, 2)+'\n');"
          git add .
          git commit -m "release: prepare v${{ steps.info.outputs.version }} (q1)"
          git push origin ${{ steps.info.outputs.branch }}

      - uses: repo-sync/pull-request@v2
        with:
          source_branch: ${{ steps.info.outputs.branch }}
          destination_branch: "qq"
          pr_title: "🚀 Release v${{ steps.info.outputs.version }} (q1)"
          pr_body: "此 PR 由 q1 指令自动创建。合并后将触发全平台构建和发布。"

      - name: Notification (Comment Only)
        if: github.event.issue.number && steps.info.outputs.is_push == 'false'
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          body: "✅ **q1 执行成功**！已创建发布分支和 PR。"

  # ==========================================
  # 2. 核心构建 Job (基于满血版 publish.yml)
  # ==========================================
  build-rust:
    name: 🏗️ Build ${{ matrix.target }}
    if: |
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '(q2)') || contains(github.event.head_commit.message, '(q5)') || contains(github.event.head_commit.message, 'Merge pull request'))) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && contains(github.event.comment.body, '发布q2')) ||
      (github.event.name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.head_ref, 'release/'))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset_name: q_linux_x64
            target: x86_64-unknown-linux-gnu
          # Win7 compatible targets (also works on Win8/10/11)
          - os: windows-2022
            asset_name: q_win_x64.exe
            target: x86_64-win7-windows-msvc
          - os: windows-2022
            asset_name: q_win_x86.exe
            target: i686-win7-windows-msvc
          # ARM64 has no Win7 (Win7 doesn't support ARM64)
          - os: windows-2022
            asset_name: q_win_arm64.exe
            target: aarch64-pc-windows-msvc
          - os: macos-14
            asset_name: q_mac_x64
            target: x86_64-apple-darwin
          - os: macos-14
            asset_name: q_mac_arm64
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libcairo2-dev libpango1.0-dev libgdk-pixbuf2.0-dev libgtk-3-dev

      - name: Set up Rust (nightly for Win7 targets)
        if: contains(matrix.target, 'win7')
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Set up Rust (stable for others)
        if: "!contains(matrix.target, 'win7')"
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust binary
        shell: bash
        run: |
          cd rust
          if [[ "${{ matrix.target }}" == *"win7"* ]]; then
            # Win7 target: use nightly + build-std
            cp Cargo_win.toml Cargo.toml
            RUSTFLAGS="-C target-feature=+crt-static" cargo +nightly build --release \
              --target ${{ matrix.target }} \
              -Z build-std=std,panic_abort
            ls -lh target/${{ matrix.target }}/release/q.exe
            cp target/${{ matrix.target }}/release/q.exe ../${{ matrix.asset_name }}
          elif [[ "${{ matrix.os }}" == *"windows"* ]]; then
            # ARM64 Windows: use stable + static CRT
            cp Cargo_win.toml Cargo.toml
            rustup target add ${{ matrix.target }}
            RUSTFLAGS="-C target-feature=+crt-static" cargo build --release --target ${{ matrix.target }}
            ls -lh target/${{ matrix.target }}/release/q.exe
            cp target/${{ matrix.target }}/release/q.exe ../${{ matrix.asset_name }}
          else
            # Linux/macOS
            rustup target add ${{ matrix.target }}
            cargo build --release --target ${{ matrix.target }}
            cp target/${{ matrix.target }}/release/q ../${{ matrix.asset_name }}
            chmod +x ../${{ matrix.asset_name }}
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  # ==========================================
  # 3. 发布 Job (汇总产物 + VSIX + Marketplace)
  # ==========================================
  q2-release:
    name: "🚀 q2: Finalize Release"
    needs: build-rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🛡️ Checkout Private Workflow Assets
        uses: actions/checkout@v4
        with:
          repository: kkn1n/qqqworkflow
          token: ${{ secrets.GH_PAT }}
          path: qqqworkflow
          ref: qq

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: |
          npm install
          # 使用 --force 绕过平台检查，并显式锁定每一个平台二进制包的版本
          npm install \
            @ffmpeg-installer/win32-x64@4.1.0 \
            @ffmpeg-installer/win32-ia32@4.1.0 \
            @ffmpeg-installer/linux-x64@4.1.0 \
            @ffmpeg-installer/linux-arm64@4.1.4 \
            @ffmpeg-installer/darwin-x64@4.1.0 \
            @ffmpeg-installer/darwin-arm64@4.1.5 \
            --no-save --force

      - name: Build and Package Platform-Specific VSIXs
        run: |
          node qqqworkflow/git_help.js package

      - name: Cleanup temporary build artifacts
        run: |
          # Remove q_engine.exe/q_engine (temporary files from packaging)
          rm -f assets/q_engine assets/q_engine.exe

      - name: Get version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: Release v${{ steps.get_version.outputs.VERSION }}
          files: |
            assets/q_*
            dist/*.vsix
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to VS Code Marketplace
        if: "!contains(github.event.head_commit.message, '(q5)')"
        run: npm run ci:publish || echo "Marketplace发布失败，可能是Token过期"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Strip zip extra fields from VSIX (Open VSX requirement)
        if: "!contains(github.event.head_commit.message, '(q5)')"
        run: |
          for vsix in dist/*.vsix; do
            tmpdir=$(mktemp -d)
            unzip -q "$vsix" -d "$tmpdir"
            rm "$vsix"
            (cd "$tmpdir" && zip -X -r "$OLDPWD/$vsix" .)
            rm -rf "$tmpdir"
            echo "✅ Stripped extra fields: $vsix"
          done

      - name: Publish to Open VSX
        if: "!contains(github.event.head_commit.message, '(q5)')"
        run: |
          npm install -g ovsx
          for vsix in dist/*.vsix; do
            ovsx publish "$vsix" --pat ${{ secrets.OVSX_PAT }} || echo "Open VSX发布 $vsix 失败"
          done
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Feedback
        if: github.event.issue.number
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          body: "🎉 **q2 发布成功**！版本 v${{ steps.get_version.outputs.VERSION }} 的全平台产物和 VSIX 插件已就绪。"

  # ==========================================
  # 4. q12: 仅编译 Win64 + 打通用包（可网站手动上传）
  # ==========================================
  q12-build-win64:
    name: "🏗️ q12: Build Win64"
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '(q12)')
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (nightly for Win7)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Build Rust binary (Win7-compatible x64)
        shell: bash
        run: |
          cd rust
          cp Cargo_win.toml Cargo.toml
          RUSTFLAGS="-C target-feature=+crt-static" cargo +nightly build --release \
            --target x86_64-win7-windows-msvc \
            -Z build-std=std,panic_abort
          cp target/x86_64-win7-windows-msvc/release/q.exe ../q_win_x64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: q_win_x64.exe
          path: q_win_x64.exe

  q12-universal-package:
    name: "📦 q12: Universal VSIX"
    needs: q12-build-win64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🛡️ Checkout Private Workflow Assets
        uses: actions/checkout@v4
        with:
          repository: kkn1n/qqqworkflow
          token: ${{ secrets.GH_PAT }}
          path: qqqworkflow
          ref: qq

      - name: Download Win64 binary
        uses: actions/download-artifact@v4
        with:
          name: q_win_x64.exe
          path: assets

      - name: Rename binary to q_engine.exe
        run: cp assets/q_win_x64.exe assets/q_engine.exe

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: |
          npm install
          npm install @ffmpeg-installer/win32-x64@4.1.0 --no-save --force

      - name: Embed FFmpeg (Win64)
        run: cp node_modules/@ffmpeg-installer/win32-x64/ffmpeg.exe assets/ffmpeg.exe

      - name: Bundle
        run: npm run bundle

      - name: Package universal VSIX
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          npx @vscode/vsce package --allow-missing-repository --allow-star-activation --no-dependencies -o "dist/${PKG_NAME}-${VERSION}-universal.vsix"

      - name: Get version
        id: get_version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}-universal
          name: "Universal v${{ steps.get_version.outputs.VERSION }} (手动上传用)"
          files: dist/*.vsix
          generate_release_notes: false
          body: "通用 VSIX 包（内含 Win64 引擎），可直接在 VS Code Marketplace 网站手动上传。"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
