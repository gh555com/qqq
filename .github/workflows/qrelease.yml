name: 🚀 Full-Stack Release System (q1/q2)

on:
  issue_comment:
    types: [created]
  push:
    branches: [qq]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # ==========================================
  # 1. q1: 创建发布PR
  # ==========================================
  q1-create-pr:
    name: "🔄 q1: Create Release PR"
    if: github.event.issue.pull_request == null && contains(github.event.comment.body, '发布q1')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calculate Next Version
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          NEXT=$(echo $CURRENT | awk -F. '{print $1"."($2+1)".0"}')
          echo "next=$NEXT" >> $GITHUB_OUTPUT
          echo "branch=release/v$NEXT" >> $GITHUB_OUTPUT
      - name: Create Release Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b ${{ steps.version.outputs.branch }}
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json')); p.version='${{ steps.version.outputs.next }}'; fs.writeFileSync('package.json', JSON.stringify(p, null, 2)+'\n');"
          git add .
          git commit -m "release: prepare v${{ steps.version.outputs.next }} (q1)"
          git push origin ${{ steps.version.outputs.branch }}
      - uses: repo-sync/pull-request@v2
        with:
          source_branch: ${{ steps.version.outputs.branch }}
          destination_branch: "qq"
          pr_title: "🚀 Release v${{ steps.version.outputs.next }} (q1)"
          pr_body: "此 PR 由 q1 指令自动创建。合并后将触发全平台真实构建。"
      - uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          body: "✅ **q1 执行成功**！已创建发布分支和 PR。"

  # ==========================================
  # 2. 核心构建 Job (Matrix 矩阵并行)
  # ==========================================
  build:
    name: 🏗️ Build ${{ matrix.target }}
    if: |
      (github.event_name == 'push' && contains(github.event.head_commit.message, '(q2)')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && contains(github.event.comment.body, '发布q2')) ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.head_ref, 'release/'))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: q_linux_x64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: q_mac_x64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: q_mac_arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: q_win_x64.exe
          - os: windows-latest
            target: i686-pc-windows-msvc
            asset_name: q_win_x86.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset_name: q_win_arm64.exe

    steps:
      - uses: actions/checkout@v4

      - name: 🛠️ Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libglib2.0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev

      - name: ⚙️ Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 🔨 Real Cargo Build
        run: |
          cd rust
          # 如果是 Windows，先准备好特定的 Cargo.toml
          if [ "${{ runner.os }}" == "Windows" ]; then
            cp Cargo_win.toml Cargo.toml
          fi
          cargo build --release --target ${{ matrix.target }}

      - name: 📦 Prepare Artifact
        shell: bash
        run: |
          mkdir -p ../dist-assets
          if [ "${{ runner.os }}" == "Windows" ]; then
            cp rust/target/${{ matrix.target }}/release/q*.exe ./dist-assets/${{ matrix.asset_name }}
          else
            cp rust/target/${{ matrix.target }}/release/q* ./dist-assets/${{ matrix.asset_name }}
            chmod +x ./dist-assets/${{ matrix.asset_name }}
          fi

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist-assets/${{ matrix.asset_name }}

  # ==========================================
  # 3. 发布 Job (汇总所有产物)
  # ==========================================
  q2-release:
    name: "🚀 q2: Finalize Release"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-assets
          merge-multiple: true

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 🏷️ Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          files: all-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Feedback
        if: github.event.issue.number
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          body: "🎉 **q2 发布成功**！版本 v${{ steps.get_version.outputs.version }} 的全平台真实产物已上传。"
