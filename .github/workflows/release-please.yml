name: release-please

on:
  push:
    branches:
      - qq

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: qq

      # Optional: You can add steps here that run after a release is created
      # but before the publish workflow starts, if needed.
