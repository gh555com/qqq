name: release-please

on:
  push:
    branches: [ "qq" ]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          command: release
          config-file: release-please-config.json
          default-branch: qq