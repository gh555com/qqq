name: Build qqq IDE Shell

on:
  workflow_dispatch:
    inputs:
      vscode_tag:
        description: 'VS Code version tag (1.77.3 = last patch of 1.77, last Win7-compatible Electron 19 line)'
        default: '1.77.3'
        type: string

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CODE_DIR: ide/.build/code-oss

    steps:
      - uses: actions/checkout@v4

      # vscode 1.77 era used Node 16.14.2 (.nvmrc) + yarn 1.x + python 3.x
      - uses: actions/setup-node@v4
        with:
          node-version: '16.14.2'

      - name: Setup yarn 1.22
        shell: pwsh
        run: npm install -g yarn@1.22.19

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Clone Code-OSS ${{ inputs.vscode_tag }}
        run: git clone --depth 1 --branch ${{ inputs.vscode_tag }} https://github.com/microsoft/vscode.git ${{ env.CODE_DIR }}

      - name: Overlay product.json
        run: python ide/scripts/merge_product.py ${{ env.CODE_DIR }}/product.json ide/product.json ${{ env.CODE_DIR }}/product.json

      - name: Sanity check merged product.json (fail-fast before 45min compile)
        shell: pwsh
        run: |
          $p = Get-Content "${{ env.CODE_DIR }}/product.json" -Raw | ConvertFrom-Json
          Write-Host "nameShort        = $($p.nameShort)"
          Write-Host "applicationName  = $($p.applicationName)"
          Write-Host "quality          = $($p.quality)"
          Write-Host "builtInExtensions count = $($p.builtInExtensions.Count)"
          if ($p.builtInExtensions.Count -gt 0) {
            Write-Host "::error::builtInExtensions is non-empty; bundle-marketplace-extensions-build will fetch and likely fail."
            $p.builtInExtensions | ForEach-Object { Write-Host "  - $($_.name)@$($_.version)" }
            exit 1
          }
          Write-Host "OK: no marketplace fetches will be attempted."

      - name: yarn install
        working-directory: ${{ env.CODE_DIR }}
        shell: pwsh
        env:
          # vscode 1.77 native modules need this for newer Node toolchains in CI
          npm_config_target: ''
          ELECTRON_SKIP_BINARY_DOWNLOAD: '0'
        run: yarn --frozen-lockfile --network-timeout 600000

      - name: Source patch (after install to avoid postinstall conflicts)
        shell: pwsh
        run: |
          $d = "${{ env.CODE_DIR }}"
          $wb = "$d/src/vs/workbench/workbench.desktop.main.ts"

          function CL([string]$f, [string]$p, [string]$desc) {
            if (-not (Test-Path $f)) { Write-Host "  [x] missing: $desc ($f)"; return }
            $l = Get-Content $f -Encoding UTF8; $h = 0
            for ($i=0; $i -lt $l.Count; $i++) {
              if ($l[$i] -match $p -and $l[$i] -notmatch '^//') {
                $l[$i] = "// qqq: removed -- " + $l[$i].TrimStart(); $h++
              }
            }
            $l | Set-Content $f -Encoding UTF8
            Write-Host "  $desc : $h hits"
          }

          Write-Host "=== 3a. Remove Chat / InlineChat ==="
          CL $wb 'contrib/chat/' 'Chat imports'
          CL $wb 'contrib/inlineChat/' 'InlineChat imports'

          Write-Host "=== 3b. Remove unwanted extensions (keep ipynb to be safe in 1.77 build pipeline) ==="
          @('github-authentication','microsoft-authentication','github','tunnel-forwarding') | ForEach-Object {
            $dir = "$d/extensions/$_"
            if (Test-Path $dir) { Remove-Item $dir -Recurse -Force; Write-Host "  deleted $_" }
          }

          Write-Host "=== Surgery complete (telemetry disabled via product.json overlay) ==="

      - name: Compile vscode-win32-x64
        working-directory: ${{ env.CODE_DIR }}
        run: yarn gulp vscode-win32-x64

      - name: Locate compiled artifact dir
        id: locate
        shell: pwsh
        run: |
          # vscode gulp outputs to ../VSCode-win32-x64 relative to source dir
          $candidates = @(
            "ide/.build/VSCode-win32-x64",
            "ide/.build/code-oss/../VSCode-win32-x64"
          )
          foreach ($c in $candidates) {
            if (Test-Path $c) {
              $abs = (Resolve-Path $c).Path
              Write-Host "Found artifact dir: $abs"
              "ARTIFACT_DIR=$abs" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              exit 0
            }
          }
          Write-Host "::error::compiled artifact dir not found; searched: $($candidates -join ', ')"
          Get-ChildItem ide/.build/ -Directory | ForEach-Object { Write-Host "  child: $($_.FullName)" }
          exit 1

      - name: Trigger portable mode (mkdir data/)
        shell: pwsh
        run: |
          $art = "${{ steps.locate.outputs.ARTIFACT_DIR }}"
          New-Item -ItemType Directory -Force "$art/data" | Out-Null
          New-Item -ItemType Directory -Force "$art/data/user-data" | Out-Null
          New-Item -ItemType Directory -Force "$art/data/extensions" | Out-Null
          # qqq portable marker (also serves as proof-of-life for sanity check)
          "qqq-ide portable build $(Get-Date -Format o) tag=${{ inputs.vscode_tag }}" `
            | Out-File -FilePath "$art/data/.qqq-portable" -Encoding utf8
          Write-Host "Portable data/ folder created at: $art/data"

      - name: Final sanity check (artifact integrity)
        shell: pwsh
        run: |
          $art = "${{ steps.locate.outputs.ARTIFACT_DIR }}"
          $exe = Get-ChildItem $art -Filter "*.exe" -File | Where-Object { $_.Name -notmatch 'crashpad|unins' } | Select-Object -First 1
          if (-not $exe) { Write-Host "::error::no main exe found in $art"; exit 1 }
          Write-Host "Main exe : $($exe.Name) ($([math]::Round($exe.Length/1MB,2)) MB)"
          if (-not (Test-Path "$art/data")) { Write-Host "::error::data/ folder missing (portable mode trigger)"; exit 1 }
          if (-not (Test-Path "$art/data/.qqq-portable")) { Write-Host "::error::portable marker missing"; exit 1 }
          $sz = (Get-ChildItem $art -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host "Artifact total size: $([math]::Round($sz/1MB,2)) MB"
          Write-Host "OK: artifact integrity verified."

      - name: Upload qqq IDE artifact
        uses: actions/upload-artifact@v4
        with:
          name: qqq-ide-portable-win32-x64
          path: ${{ steps.locate.outputs.ARTIFACT_DIR }}
          retention-days: 90
          compression-level: 6
