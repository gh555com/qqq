






















































[package]
name = "q"
version = "1.0.0"
edition = "2021"
authors = ["qqq"]
description = "qqq Rust Daemon - Clipboard handler and file utilities"

[[bin]]
name = "q"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
rand = "0.8"

[target.'cfg(windows)'.dependencies]
# Windows 不需要额外依赖，使用 std 和 FFI

[profile.release]
opt-level = "z"      # 最小体积
lto = true           # 链接时优化
strip = true         # 移除符号
panic = "abort"      # 减小体积
codegen-units = 1    # 更好优化
















































































































































