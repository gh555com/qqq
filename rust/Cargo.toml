[package]
name = "dgs_clipboard_dumb_saver_unix"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "q"
path = "kp.rs"

[features]
# 默认全功能：剪贴板(文本/HTML/图片/文件) + extract_icon
# 注意：Linux 的 extract_icon 依赖 GTK/GIO（file_icon_provider 的依赖）且必须在主线程调用。
default = ["full"]
full = ["icons"]
icons = ["dep:file_icon_provider"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clipboard-rs = { version = "0.3.1", features = ["image"] }
file_icon_provider = { version = "1.0.0", optional = true }
filetime = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
once_cell = "1"
num_cpus = "1"
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
threadpool = "1.8"
url = "2"
walkdir = "2"
