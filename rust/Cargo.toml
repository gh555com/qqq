[package]
name = "dgs_clipboard_dumb_saver_unix"
version = "0.1.0"
edition = "2021"

[profile.release]
strip = true
lto = true
panic = "abort"
codegen-units = 1

[[bin]]
name = "q"
path = "kp.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
filetime = "0.2"
once_cell = "1.19"
rand = "0.8"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num_cpus = "1.16"
threadpool = "1.8"
walkdir = "2.5"
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
