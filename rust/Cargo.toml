[package]
name = "dumb_saver_rs"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
filetime = "0.2"
once_cell = "1"
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
threadpool = "1"
walkdir = "2"
num_cpus = "1"

# PNG 编码（图标 RGBA -> PNG）；也可给你将来扩展用
image = "0.25"

# 跨平台剪贴板：文本/图片/文件列表/HTML
# 图片能力在 feature="image" 下提供（RustImageData::to_png 等）
clipboard-rs = { version = "0.3.1", features = ["image"] }

# file:// URI -> 本地路径（Linux 文件列表常见）
url = "2"

# 跨平台文件图标提取（Win/macOS/Linux(Gnome)）
file_icon_provider = "1"
