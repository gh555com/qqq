[package]
name = "dumb_saver"
version = "0.1.0"
edition = "2021"

[package.metadata.winres]
FileDescription = "Q Clipboard Engine"
ProductName = "qqq"

[profile.release]
strip = true
lto = true
panic = "abort"
codegen-units = 1

[profile.release.build-override]
opt-level = 3

[[bin]]
name = "q"
path = "kp_win.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
filetime = "0.2"
once_cell = "1.19"
rand = "0.8"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num_cpus = "1.16"
threadpool = "1.8"
walkdir = "2.5"
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg", "gif", "webp", "ico", "tiff"] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
] }
