<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="Content-Security-Policy"
		content="default-src 'none'; script-src 'unsafe-inline' vscode-webview-resource:; style-src 'unsafe-inline' vscode-webview-resource:; img-src vscode-webview-resource: data:; font-src vscode-webview-resource:;">
	<title>qqq new 新建</title>
	<style>
		/* 全局样式和变量定义 */
		:root {
			/* 导航左右分割线宽度 - 可拖动时的宽度 */
			--sidebar-resizer-width: 8px;
			/* SZ 区域宽度，约等于 12 个等宽字符 */
			--sz-area-width: 96px;
			/* 文件/文件夹图标宽度 (包括 margin) */
			--icon-area-width: 24px;
		}

		/* 全局样式重置 */
		* {
			box-sizing: border-box;
		}
		
		/* 禁止文本选择 */
		body, .sidebar, .main-content, .file-list-container, .file-item, 
		.sz-area, .file-select-area, .folder-name-area, .file-name-area,
		.recent-item, .recycle-item, .nav-item, .context-menu-item, 
		.context-menu-empty-item, .address-bar {
			-webkit-user-select: none;
			-moz-user-select: none;
			-ms-user-select: none;
			user-select: none;
		}
		
		/* 允许输入框选择文本 */
		input, textarea {
			-webkit-user-select: text;
			-moz-user-select: text;
			-ms-user-select: text;
			user-select: text;
		}
		
		/* 自定义省略号样式 - 下靠下的三个点 */
		.custom-ellipsis {
			display: inline-block;
			position: relative;
			vertical-align: bottom;
			margin: 0 2px;
		}
		
		.custom-ellipsis::after {
			content: '...';
			position: relative;
			top: 2px; /* 向下偏移 */
		}

		html,
		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
			margin: 0;
			padding: 0;
			height: 100%;
			width: 100%;
			background-color: #f8f9fa;
		}

		body {
			display: flex;
			flex-direction: column;
			border: 1px solid #dee2e6;
		}

		/* 容器使用固定宽度 */
		.container {
			display: flex;
			flex: 1;
			width: 100%;
			max-width: 100%;
			background-color: #fff;
			position: relative;
		}

		/* 左侧导航栏 - 固定位置 */
		.sidebar {
			width: {{SIDEBAR_WIDTH}}px;
			background-color: #fff;
			border-right: 1px solid #dee2e6;
			display: flex;
			flex-direction: column;
			overflow-y: auto;
			/* 导航栏自身内容可滚动 */
			flex-shrink: 0;
			position: fixed;
			left: 0;
			top: 0;
			bottom: 60px;
			/* 为底部操作区留出空间 */
			z-index: 20;
			transition: width 0.2s ease;
		}

		/* 可拖动的分割线 */
		.sidebar-resizer {
			width: 8px;
			background-color: #e0e0e0;
			position: fixed;
			left: {{SIDEBAR_WIDTH}}px;
			top: 0;
			bottom: 60px;
			z-index: 30;
			cursor: ew-resize;
			transition: background-color 0.2s, width 0.2s;
		}

		.sidebar-resizer:hover {
			background-color: #999;
			width: 8px;
		}

		.sidebar-resizer.active {
			background-color: #666;
			width: 8px;
		}

		.sidebar-header {
			padding: 10px;
			font-weight: bold;
			background-color: #e9ecef;
			border-bottom: 1px solid #dee2e6;
		}

		.nav-item {
			padding: 8px 10px;
			border: none;
			background: none;
			width: 100%;
			text-align: left;
			font-size: 14px;
			color: #333;
		}

		.nav-item:hover {
			background-color: #e3f2fd;
		}

		.nav-item.active {
			background-color: #bbdefb;
		}

		/* 空状态提示样式 */
		.empty-recycle-bin,
		.empty-recent-section {
			padding: 20px 10px;
			color: #999;
			font-style: italic;
			text-align: center;
			font-size: 13px;
		}

		/* 主内容区 - 调整宽度和位置以避开固定的侧边栏 */
		.main-content {
			flex: 1;
			display: flex;
			flex-direction: column;
			overflow-y: hidden;
			/* 主内容区整体不滚动 */
			overflow-x: hidden;
			position: absolute;
			left: {{SIDEBAR_WIDTH}}px;
			/* 侧边栏宽度 */
			right: 0;
			top: 0;
			bottom: 0;
			transition: left 0.2s ease;
		}

		/* 最近保存目录 - 固定在顶部 */
		.recent-section {
			padding: 10px;
			background-color: #fff;
			position: sticky;
			top: 0;
			z-index: 5;
		}

		.recent-header {
			font-weight: bold;
			margin-bottom: 2px;
			font-size: 13px;
			color: #666;
		}

		.recent-list {
			display: flex;
			flex-direction: column;

			gap: {{LINE_SPACING}}

			px;
		}

		.recent-item {
			padding: 2px 8px;
			background-color: #e9ecef;
			border-radius: 0px;
			font-size: 12px;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			max-width: 100%;
			margin: 0;
			line-height: 1.2;
			display: flex;
			align-items: center;
		}

		/* 移除历史区背景色，保持简洁样式 */

		/* 删除按钮样式 */
		.delete-button {
			margin-right: 6px;
			padding: 0 4px;
			font-size: 10px;
			color: #999;
			cursor: pointer;
			opacity: 0.6;
		}

		.recent-item:hover .delete-button {
			opacity: 1;
			color: #f44336;
		}

		/* 分割线样式 */
		.divider {
			height: 1px;
			background-color: #dee2e6;
			margin: 8px 0;
		}

		/* 回收站样式 */
		.recycle-bin-section {
			padding: 8px 10px;
		}

		.recycle-bin-header {
			font-size: 12px;
			color: #666;
			font-weight: normal;
			margin-bottom: 4px;
		}

		.recycle-item {
			padding: 2px 8px;
			font-size: 11px;
			color: #888;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			cursor: pointer;
		}

		.recycle-item:hover {
			background-color: #f8f9fa;
			color: #333;
		}

		/* 地址栏 - 自动定位 */
		.address-bar {
			padding: 10px;
			background-color: #fff;
			position: static;
			z-index: 4;
		}

		.address-input {
			width: 100%;
			padding: 5px;
			border: 1px solid #ced4da;
			border-radius: 3px;
			font-size: 14px;
		}

		/* 文件列表 - 可独立滚动 */
		.file-list-container {
			flex: 1;
			overflow-y: auto;
			padding: 10px;
			overflow-x: auto;
			/* 确保滚动条始终可见 */
			scrollbar-width: thin;
			scrollbar-color: #888 #f1f1f1;
			margin-bottom: 60px;
			/* 为底部操作区留出空间 */
			padding-top: 10px;
		}

		/* 滚动条样式 */
		.file-list-container::-webkit-scrollbar {
			width: 10px;
			height: 10px;
		}

		.file-list-container::-webkit-scrollbar-track {
			background: #f1f1f1;
		}

		.file-list-container::-webkit-scrollbar-thumb {
			background: #888;
			border-radius: 5px;
		}

		.file-list-container::-webkit-scrollbar-thumb:hover {
			background: #555;
		}

		/* 文件列表项通用样式 */
		.file-item {
			padding: 0;
			/* 移除外层padding */
			border-radius: 0px;
			display: flex;
			align-items: center;

			margin: {{LINE_SPACING}}

			px 0;
			min-height: 20px;
			line-height: 1.2;
			cursor: default;
			/* 默认不显示手型 */
		}

		.file-item:hover {
			background-color: #e3f2fd;
			/* 悬停背景色 */
		}

		/* SZ 区域样式 (新增) */
		.sz-area {
			/* 恢复原始宽度，同时扩展点击区域 */
			width: var(--sz-area-width);
			height: 100%;
			min-height: 20px;
			/* 字体设置为斜体，等宽 */
			font-style: italic;
			font-family: monospace;
			font-size: 12px;
			color: #555;
			text-align: left;
			padding: 2px 0;
			line-height: 1.2;
			flex-shrink: 0;
			white-space: pre;
			/* 保持空格 */
			cursor: pointer;
			/* 改为pointer以确保点击事件响应 */
			z-index: 10;
			/* 确保点击区域在最上层 */
			position: relative;
			/* 确保z-index生效 */
			display: inline-block;
			/* 确保元素有明确的尺寸 */
			user-select: none;
			/* 防止文本选择干扰点击 */
			-webkit-user-select: none;
			/* 兼容WebKit浏览器 */
			-moz-user-select: none;
			/* 兼容Firefox */
			-ms-user-select: none;
			/* 兼容IE/Edge */
			/* 使用伪元素扩展点击区域 */
		}
		
		/* 使用伪元素扩展点击区域到整个file-select-area */
		.sz-area::before {
			content: '';
			position: absolute;
			top: 0;
			left: -8px; /* 向左扩展到分割线 */
			right: -24px; /* 向右扩展到文件夹图标 */
			bottom: 0;
			z-index: -1; /* 在sz区域内容下方 */
		}

		/* 选中操作区 */
		.file-select-area {
			display: flex;
			align-items: center;
			padding: 2px 4px 2px 8px;
			/* 恢复原始左侧padding */
			cursor: pointer;
			/* 启用手型 */
			flex-shrink: 0;
		}

		/* 文件夹名称导航区 */
		.folder-name-area {
			flex: 1;
			padding: 2px 8px 2px 4px;
			/* 右侧留出更多点击空间 */
			cursor: pointer;
			/* 启用手型 */
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		/* 文件名称区 */
		.file-name-area {
			flex: 1;
			padding: 2px 8px;
			/* 文件名区域保持一致的 padding */
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		/* 选中状态样式 */
		.file-item.selected .sz-area,
		.file-item.selected .file-select-area,
		.file-item.selected .folder-name-area,
		.file-item.selected .file-name-area {
			background-color: #ff6b00;
			color: white;
		}

		.file-item.selected .file-select-area {
			/* 确保选中时图标颜色也一致 */
			color: white;
		}

		.file-item.selected:hover {
			background-color: #ff6b00;
			/* 悬停保持选中色 */
		}

		.file-icon {
			margin-right: 0;
			font-size: 16px;
		}

		.file-name {
			flex: 1;
		}

		/* 底部操作区 - 固定在底部 */
		.footer {
			position: fixed;
			bottom: 0;
			left: 0;
			right: 0;
			padding: 10px;
			background-color: #fff;
			border-top: 1px solid #dee2e6;
			display: flex;
			justify-content: space-between;
			align-items: center;
			z-index: 10;
			box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.05);
		}

		.filename-input-container {
			flex: 1;
			margin-right: 10px;
			position: relative;
		}

		/* 长驻按钮样式 (保持不变) */
		.pin-container {
			margin-right: 37px;
			cursor: pointer;
			transform: translateX(12px) translateY(-1px);
		}

		.pin-box {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 5px;
			padding: 5px 23px;
			border-radius: 20px;
			background-color: #f5f0e6;
			transition: background-color 0.2s;
			width: 96px;
			color: #333;
		}

		.pin-box:hover {
			background-color: #e8ddc3;
		}

		.pin-box.pinned {
			background-color: #d4af37;
		}

		.pin-text {
			font-size: 16px;
			font-weight: 500;
			min-width: 40px;
			display: inline-block;
			text-align: center;
		}

		.pin-checkbox {
			font-size: 15px;
			font-family: monospace;
			min-width: 20px;
			display: inline-block;
			text-align: center;
		}

		.filename-input {
			width: 100%;
			padding: 5px 5px 5px 6px;
			border: 1px solid #ced4da;
			border-radius: 3px;
			font-size: 14px;
		}

		.filename-label {
			font-size: 13px;
			color: #666;
			margin-bottom: 3px;
			display: block;
		}

		.button {
			padding: 6px 12px;
			border: none;
			border-radius: 3px;
			font-size: 14px;
			cursor: pointer;
		}

		.save-button {
			background-color: #0078d4;
			color: white;
		}

		.cancel-button {
			background-color: #f4f4f4;
			color: #333;
			margin-left: 5px;
		}


		/* 右侧功能按钮浮窗样式 (移除) */
		/* .action-buttons-float, .action-button 样式被移除 */

		/* 右键菜单样式 (新增) */
		.context-menu {
			position: fixed;
			background-color: #fff;
			border: 1px solid #ccc;
			box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
			z-index: 9999;
			padding: 4px 0;
			min-width: 150px;
			display: none;
			flex-direction: column;
		}

		.context-menu-item {
			display: flex;
			justify-content: space-between;
			align-items: center;
			padding: 6px 12px;
			cursor: pointer;
			font-size: 13px;
			white-space: nowrap;
		}

		.context-menu-item:hover {
			background-color: #e3f2fd;
		}

		.context-menu-shortcut {
			color: #777;
			font-size: 12px;
			margin-left: 20px;
		}

		/* 右键空白处菜单样式 */
		.context-menu-empty {
			position: fixed;
			background-color: #fff;
			border: 1px solid #ccc;
			box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
			z-index: 9999;
			padding: 4px 0;
			min-width: 120px;
			display: none;
			flex-direction: column;
		}

		.context-menu-empty-item {
			padding: 6px 12px;
			cursor: pointer;
			font-size: 13px;
			white-space: nowrap;
		}

		.context-menu-empty-item:hover {
			background-color: #e3f2fd;
		}

		.context-menu-empty-item.selected {
			font-weight: bold;
			background-color: #bbdefb;
		}
	</style>
</head>

<body>
	<div class="container">
		<div class="sidebar">
			<div class="sidebar-header">文件导航</div>
			{{DRIVES_HTML}}

			{{RECYCLE_BIN_HTML}}
		</div>

		<div class="sidebar-resizer" id="sidebarResizer"></div>

		<div class="main-content" id="mainContent">
			<div class="recent-section">
				<div class="recent-list">
					{{RECENT_DIRS_HTML}}
				</div>
			</div>

			<div class="address-bar">
				<input type="text" id="addressInput" class="address-input" value="{{CURRENT_PATH}}"
					onkeydown="handleAddressInputKeyDown(event)">
			</div>

			<div class="file-list-container" id="fileList" style="margin-bottom: 60px;">
			</div>

			<div class="footer">
				<div id="pinButton" class="pin-container" onclick="togglePin()">
					<div class="pin-box {{PIN_CLASS}}">
						<span class="pin-text">长驻</span>
						<span class="pin-checkbox">{{PIN_CHECKBOX}}</span>
					</div>
				</div>
				<div class="filename-input-container">
					<input type="text" id="filenameInput" class="filename-input"
						onkeydown="handleFilenameInputKeyDown(event)">
				</div>
				<div style="display: flex; gap: 15px;">
					<button class="button save-button" onclick="saveFile()" title="新建文件">
						<svg width="20" height="20" viewBox="0 0 24 24" fill="white">
							<path
								d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z" />
						</svg>
					</button>
					<button class="button cancel-button" onclick="createFolder()" title="新建文件夹">
						<svg width="20" height="20" viewBox="0 0 24 24" fill="#333">
							<path
								d="M10,4H4C2.89,4 2,4.89 2,6V20A2,2 0 0,0 4,22H20A2,2 0 0,0 22,20V8L16,2H10M13,9V3.5L18.5,9H13Z" />
						</svg>
					</button>
				</div>
			</div>
		</div>
	</div>

	<div id="emptyContextMenu" class="context-menu-empty">
		<div class="context-menu-empty-item {{SIZE_MODE_NONE_CLASS}}" data-mode="none"
			onclick="setSizeMode('none');refreshSizeDisplay();">none</div>
		<div class="context-menu-empty-item {{SIZE_MODE_M_CLASS}}" data-mode="m"
			onclick="setSizeMode('m');refreshSizeDisplay();">m</div>
		<div class="context-menu-empty-item {{SIZE_MODE_K_CLASS}}" data-mode="k"
			onclick="setSizeMode('k');refreshSizeDisplay();">k</div>
		<div class="context-menu-empty-item {{SIZE_MODE_B_CLASS}}" data-mode="b"
			onclick="setSizeMode('b');refreshSizeDisplay();">b</div>
	</div>

	<div id="itemContextMenu" class="context-menu">
		<div class="context-menu-item" data-action="rename" data-shortcut="q">
			<span>rename</span>
			<span class="context-menu-shortcut">= "q"</span>
		</div>
		<div class="context-menu-item" data-action="open" data-shortcut="w">
			<span>open</span>
			<span class="context-menu-shortcut">= "w"</span>
		</div>
		<div class="context-menu-item" data-action="delete" data-shortcut="s">
			<span>delete</span>
			<span class="context-menu-shortcut">= "s"</span>
		</div>
		<div class="context-menu-item" data-action="kode" data-shortcut="e">
			<span>kode</span>
			<span class="context-menu-shortcut">= "e"</span>
		</div>
	</div>
	<script>
    {{INLINE_SCRIPT}}
</script>

</body>

</html>
