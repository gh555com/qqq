<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="Content-Security-Policy"
		content="default-src 'none'; script-src 'unsafe-inline' vscode-webview-resource:; style-src 'unsafe-inline' vscode-webview-resource:; img-src vscode-webview-resource: data:; font-src vscode-webview-resource:;">
	<title>qqq new 新建</title>
	<style>
		/* Solarized Light Palette Definitions */
		:root {
			/* Solarized 核心变量 */
			--base03: #002b36;
			--base02: #073642;
			--base01: #586e75;
			--base00: #657b83;
			/* 正文主要颜色 */
			--base0: #839496;
			--base1: #93a1a1;
			/* 边框、次要文字 */
			--base2: #eee8d5;
			/* 背景高亮、头部背景 */
			--base3: #fdf6e3;
			/* 主背景色 */
			--yellow: #b58900;
			--orange: #cb4b16;
			/* 强调/选中色 */
			--red: #dc322f;
			--magenta: #d33682;
			--violet: #6c71c4;
			--blue: #268bd2;
			/* 按钮/链接 */
			--cyan: #2aa198;
			--green: #859900;

			/* 功能性变量映射 */
			--bg-color: var(--base3);
			--bg-highlight: var(--base2);
			--text-primary: var(--base00);
			--text-secondary: var(--base01);
			--text-dim: var(--base1);
			--border-color: var(--base2);
			/* 浅边框 */
			--border-strong: var(--base1);
			/* 深边框 */
			--selection-bg: var(--orange);
			--selection-text: var(--base3);
			--button-primary: var(--blue);
			--button-text: var(--base3);

			/* 原有布局变量 */
			--sidebar-resizer-width: 8px;
			--sz-area-width: 96px;
			--icon-area-width: 24px;

			/* 新增：响应式阈值 */
			--min-responsive-width: 200px;
			--min-tag-width: 170px;
		}

		/* 全局样式重置 & 强制颜色模式 */
		* {
			box-sizing: border-box;
			/* 关键：在高对比度模式下强制使用自定义颜色 */
			forced-color-adjust: none;
			-ms-high-contrast-adjust: none;
		}

		/* 禁止文本选择 */
		body,
		.sidebar,
		.main-content,
		.file-list-container,
		.file-item,
		.sz-area,
		.file-select-area,
		.folder-name-area,
		.file-name-area,
		.recent-item,
		.recycle-item,
		.nav-item,
		.context-menu-item,
		.context-menu-empty-item,
		.address-bar {
			-webkit-user-select: none;
			-moz-user-select: none;
			-ms-user-select: none;
			user-select: none;
		}

		/* 允许输入框选择文本 */
		input,
		textarea {
			-webkit-user-select: text;
			-moz-user-select: text;
			-ms-user-select: text;
			user-select: text;
		}

		/* 自定义省略号样式 */
		.custom-ellipsis {
			display: inline-block;
			position: relative;
			vertical-align: bottom;
			margin: 0 2px;
		}

		.custom-ellipsis::after {
			content: '...';
			position: relative;
			top: 2px;
		}

		html,
		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
			margin: 0;
			padding: 0;
			height: 100%;
			width: 100%;
			background-color: var(--bg-color);
			/* Solarized Base3 */
			color: var(--text-primary);
			/* Solarized Base00 */
		}

		body {
			display: flex;
			flex-direction: column;
			border: 1px solid var(--border-strong);
		}

		/* 容器 */
		.container {
			display: flex;
			flex: 1;
			width: 100%;
			max-width: 100%;
			background-color: var(--bg-color);
			position: relative;
		}

		/* 左侧导航栏 */
		.sidebar {
			width: {{SIDEBAR_WIDTH}}px;
			background-color: var(--bg-color);
			border-right: none; /* 去除细线边框，只保留粗分割线 */
			display: flex;
			flex-direction: column;
			overflow-y: auto;
			flex-shrink: 0;
			position: fixed;
			left: 0;
			top: 0;
			bottom: 60px;
			z-index: 20;
			transition: width 0.2s ease;
		}

		/* 可拖动的分割线 - 粗线，变色，支持记忆位置（JS控制） */
		.sidebar-resizer {
			width: var(--sidebar-resizer-width);
			background-color: var(--base2);
			/* Base2 */
			position: fixed;
			left: {{SIDEBAR_WIDTH}}px;
			top: 0;
			bottom: 60px;
			z-index: 30;
			cursor: ew-resize;
			transition: background-color 0.2s, width 0.2s;
			border: none; /* 确保无细线 */
		}

		.sidebar-resizer:hover {
			background-color: var(--base1);
			/* Base1 */
			width: calc(var(--sidebar-resizer-width) * 1.5); /*  hover时稍粗 */
		}

		.sidebar-resizer.active {
			background-color: var(--base00);
			/* Base00 */
			width: calc(var(--sidebar-resizer-width) * 1.5);
		}

		.sidebar-header {
			padding: 10px;
			font-weight: bold;
			background-color: var(--bg-highlight);
			/* Base2 */
			color: var(--text-primary);
			border-bottom: 1px solid var(--border-strong);
		}

		.nav-item {
			padding: 8px 10px;
			border: none;
			background: none;
			width: 100%;
			text-align: left;
			font-size: 14px;
			color: var(--text-primary);
		}

		.nav-item:hover {
			background-color: var(--bg-highlight);
			/* Base2 */
		}

		.nav-item.active {
			background-color: var(--base1);
			/* Base1 */
			color: var(--base3);
		}

		/* 空状态提示样式 */
		.empty-recycle-bin,
		.empty-recent-section {
			padding: 20px 10px;
			color: var(--text-dim);
			/* Base1 */
			font-style: italic;
			text-align: center;
			font-size: 13px;
		}

		/* 主内容区 */
		.main-content {
			flex: 1;
			display: flex;
			flex-direction: column;
			overflow-y: hidden;
			overflow-x: hidden;
			position: absolute;
			left: {{SIDEBAR_WIDTH}}px;
			right: 0;
			top: 0;
			bottom: 0;
			transition: left 0.2s ease;
			background-color: var(--bg-color);
		}

		/* 最近保存目录 - 上方历史区 */
		.recent-section {
			padding: 10px;
			background-color: var(--bg-color);
			position: sticky;
			top: 0;
			z-index: 5;
			border-bottom: 1px solid var(--border-color);
		}

		.recent-header {
			font-weight: bold;
			margin-bottom: 2px;
			font-size: 13px;
			color: var(--text-secondary);
			/* Base01 */
		}

		.recent-list {
			display: flex;
			flex-direction: column;
			gap: {{LINE_SPACING}}px;
		}

		.recent-item {
			padding: 2px 8px;
			background-color: var(--bg-highlight);
			/* Base2 */
			color: var(--text-primary);
			border-radius: 0px;
			font-size: 12px;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			max-width: 100%;
			margin: 0;
			line-height: 1.2;
			display: flex;
			align-items: center;
			cursor: pointer; /* 确保可点击 */
			position: relative; /* 用于hover效果 */
		}

		/* 增强上方历史区的hover效果：底色选中 */
		.recent-item:hover {
			background-color: var(--base1); /* 更明显的底色选中效果 */
		}

		/* 删除按钮样式 */
		.delete-button {
			margin-right: 6px;
			padding: 0 4px;
			font-size: 10px;
			color: var(--text-dim);
			cursor: pointer;
			opacity: 0.6;
		}

		.recent-item:hover .delete-button {
			opacity: 1;
			color: var(--red);
			/* Solarized Red */
		}

		/* 分割线样式 */
		.divider {
			height: 1px;
			background-color: var(--border-strong);
			margin: 8px 0;
		}

		/* 回收站样式 */
		.recycle-bin-section {
			padding: 8px 10px;
		}

		.recycle-bin-header {
			font-size: 12px;
			color: var(--text-secondary);
			font-weight: normal;
			margin-bottom: 4px;
		}

		.recycle-item {
			padding: 2px 8px;
			font-size: 11px;
			color: var(--text-dim);
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			cursor: pointer;
		}

		.recycle-item:hover {
			background-color: var(--bg-highlight);
			color: var(--text-primary);
		}

		/* 地址栏 */
		.address-bar {
			padding: 10px;
			background-color: var(--bg-color);
			position: static;
			z-index: 4;
		}

		.address-input {
			width: 100%;
			padding: 5px;
			border: 1px solid var(--border-strong);
			border-radius: 3px;
			font-size: 14px;
			background-color: var(--bg-color);
			color: var(--text-primary);
		}

		/* 文件列表 - 支持上下滚动条，实时计算高度 */
		.file-list-container {
			flex: 1;
			overflow-y: auto; /* 启用垂直滚动 */
			overflow-x: auto;
			padding: 10px;
			scrollbar-width: thin;
			scrollbar-color: var(--base1) var(--base2);
			/* Firefox 滚动条配色 */
			margin-bottom: 60px;
			padding-top: 10px;
			min-height: 0; /* 允许flex收缩以触发滚动 */
		}

		/* 滚动条样式 */
		.file-list-container::-webkit-scrollbar {
			width: 10px;
			height: 10px;
		}

		.file-list-container::-webkit-scrollbar-track {
			background: var(--bg-highlight);
			/* Base2 */
		}

		.file-list-container::-webkit-scrollbar-thumb {
			background: var(--base1);
			/* Base1 */
			border-radius: 5px;
		}

		.file-list-container::-webkit-scrollbar-thumb:hover {
			background: var(--base00);
			/* Base00 */
		}

		/* 文件列表项通用样式 - 确保整个区域响应hover和点击 */
		.file-item {
			padding: 0;
			border-radius: 0px;
			display: flex;
			align-items: center;
			margin: {{LINE_SPACING}}px 0;
			min-height: 20px;
			line-height: 1.2;
			cursor: pointer; /* 整个项可点击 */
			position: relative; /* 用于选中背景覆盖 */
			overflow: hidden; /* 防止子元素溢出 */
		}

		/* Hover效果：整个背景色响应，确保无死区 */
		.file-item:hover {
			background-color: var(--bg-highlight) !important; /* 强制覆盖，确保4px下方也响应 */
		}

		/* 选中状态：完整橘红色矩形，覆盖整个项，修正拼接问题 */
		.file-item.selected {
			background-color: var(--selection-bg) !important; /* 完整矩形覆盖 */
			color: var(--selection-text);
		}

		/* 修正选中子元素：统一背景，确保无拼接缝隙 */
		.file-item.selected .sz-area,
		.file-item.selected .file-select-area,
		.file-item.selected .folder-name-area,
		.file-item.selected .file-name-area {
			background-color: transparent !important; /* 子元素透明，让父级背景覆盖 */
			color: var(--selection-text);
			padding-top: 2px; /* 左边粗一点：增加上内边距 */
			padding-bottom: 2px;
		}

		.file-item.selected .file-name-area {
			padding-top: 1px; /* 右边细一点：减少上内边距 */
			padding-bottom: 1px;
		}

		.file-item.selected:hover {
			background-color: var(--selection-bg) !important; /* 保持选中hover */
		}

		/* SZ 区域样式 - 确保点击响应 */
		.sz-area {
			width: var(--sz-area-width);
			height: 100%;
			min-height: 20px;
			font-style: italic;
			font-family: monospace;
			font-size: 12px;
			color: var(--text-dim);
			/* Base1 */
			text-align: left;
			padding: 2px 0;
			line-height: 1.2;
			flex-shrink: 0;
			white-space: pre;
			cursor: pointer;
			z-index: 10;
			position: relative;
			display: inline-block;
			user-select: none;
			-webkit-user-select: none;
			-moz-user-select: none;
			-ms-user-select: none;
		}

		.sz-area::before {
			content: '';
			position: absolute;
			top: 0;
			left: -8px;
			right: -24px;
			bottom: 0;
			z-index: -1;
			height: 100%; /* 确保全高覆盖，无4px死区 */
		}

		/* 选中操作区 - 确保点击全覆盖 */
		.file-select-area {
			display: flex;
			align-items: center;
			padding: 2px 4px 2px 8px;
			cursor: pointer;
			flex-shrink: 0;
			height: 100%; /* 全高 */
		}

		/* 文件夹名称导航区 */
		.folder-name-area {
			flex: 1;
			padding: 2px 8px 2px 4px;
			cursor: pointer;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			height: 100%; /* 全高，确保点击响应 */
		}

		/* 文件名称区 */
		.file-name-area {
			flex: 1;
			padding: 2px 8px;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			height: 100%; /* 全高 */
		}

		.file-icon {
			margin-right: 0;
			font-size: 16px;
		}

		.file-name {
			flex: 1;
		}

		/* 底部操作区 - 响应式：宽度<200px时隐藏非核心组件 */
		.footer {
			position: fixed;
			bottom: 0;
			left: 0;
			right: 0;
			padding: 10px;
			background-color: var(--bg-color);
			/* Base3 */
			border-top: 1px solid var(--border-strong);
			display: flex;
			justify-content: space-between;
			align-items: center;
			z-index: 10;
			box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.05);
			gap: 10px; /* 响应式间距 */
		}

		/* 响应式：宽度小于200px时，隐藏长驻和编辑框，只保留新建按钮 */
		@media (max-width: var(--min-responsive-width)) {
			.pin-container {
				display: none; /* 舍弃长驻 */
			}

			.filename-input-container {
				display: none; /* 舍弃文件名编辑框 */
			}

			.footer > div:last-child {
				flex: 1; /* 新建按钮占满 */
				justify-content: flex-end;
			}
		}

		/* 进一步极限：宽度<170px时，只显示新建文件按钮，隐藏新建文件夹 */
		@media (max-width: var(--min-tag-width)) {
			.footer > div:last-child button:last-child {
				display: none; /* 舍弃新建文件夹 */
			}
		}

		.filename-input-container {
			flex: 1;
			margin-right: 10px;
			position: relative;
		}

		/* 长驻按钮样式 */
		.pin-container {
			margin-right: 37px;
			cursor: pointer;
			transform: translateX(12px) translateY(-1px);
		}

		.pin-box {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 5px;
			padding: 5px 23px;
			border-radius: 20px;
			background-color: var(--bg-highlight);
			/* Base2 */
			transition: background-color 0.2s;
			width: 96px;
			color: var(--text-primary);
		}

		.pin-box:hover {
			background-color: #d3d1c4;
			/* Base2 稍暗版本 */
		}

		.pin-box.pinned {
			background-color: var(--yellow);
			/* Solarized Yellow */
			color: var(--base3);
		}

		.pin-text {
			font-size: 16px;
			font-weight: 500;
			min-width: 40px;
			display: inline-block;
			text-align: center;
		}

		.pin-checkbox {
			font-size: 15px;
			font-family: monospace;
			min-width: 20px;
			display: inline-block;
			text-align: center;
		}

		.filename-input {
			width: 100%;
			padding: 5px 5px 5px 6px;
			border: 1px solid var(--border-strong);
			border-radius: 3px;
			font-size: 14px;
			background-color: var(--bg-color);
			color: var(--text-primary);
		}

		.filename-label {
			font-size: 13px;
			color: var(--text-secondary);
			margin-bottom: 3px;
			display: block;
		}

		.button {
			padding: 6px 12px;
			border: none;
			border-radius: 3px;
			font-size: 14px;
			cursor: pointer;
		}

		.save-button {
			background-color: var(--button-primary);
			/* Solarized Blue */
			color: var(--button-text);
		}

		.cancel-button {
			background-color: var(--bg-highlight);
			/* Base2 */
			color: var(--text-primary);
			margin-left: 5px;
		}


		/* 右键菜单样式 */
		.context-menu {
			position: fixed;
			background-color: var(--bg-color);
			border: 1px solid var(--border-strong);
			box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
			z-index: 9999;
			padding: 4px 0;
			min-width: 150px;
			display: none;
			flex-direction: column;
		}

		.context-menu-item {
			display: flex;
			justify-content: space-between;
			align-items: center;
			padding: 6px 12px;
			cursor: pointer;
			font-size: 13px;
			white-space: nowrap;
			color: var(--text-primary);
		}

		.context-menu-item:hover {
			background-color: var(--bg-highlight);
			/* Base2 */
		}

		.context-menu-shortcut {
			color: var(--text-dim);
			font-size: 12px;
			margin-left: 20px;
		}

		/* 右键空白处菜单样式 */
		.context-menu-empty {
			position: fixed;
			background-color: var(--bg-color);
			border: 1px solid var(--border-strong);
			box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
			z-index: 9999;
			padding: 4px 0;
			min-width: 120px;
			display: none;
			flex-direction: column;
		}

		.context-menu-empty-item {
			padding: 6px 12px;
			cursor: pointer;
			font-size: 13px;
			white-space: nowrap;
			color: var(--text-primary);
		}

		.context-menu-empty-item:hover {
			background-color: var(--bg-highlight);
			/* Base2 */
		}

		.context-menu-empty-item.selected {
			font-weight: bold;
			background-color: var(--base1);
			/* Base1 */
			color: var(--base3);
		}

		/* 上下高度响应式：如果总高度超过容器，启用滚动（JS实时计算） */
		.main-content {
			min-height: 0; /* 允许收缩 */
		}

		.recent-section {
			flex-shrink: 0; /* 固定高度，不收缩 */
		}

		.address-bar {
			flex-shrink: 0;
		}

		.file-list-container {
			flex: 1 1 auto; /* 允许增长和收缩 */
		}
	</style>
</head>

<body>
	<div class="container">
		<div class="sidebar">
			<div class="sidebar-header">文件导航</div>
			{{DRIVES_HTML}}

			{{RECYCLE_BIN_HTML}}
		</div>

		<div class="sidebar-resizer" id="sidebarResizer"></div>

		<div class="main-content" id="mainContent">
			<div class="recent-section">
				<div class="recent-list">
					{{RECENT_DIRS_HTML}}
				</div>
			</div>

			<div class="address-bar">
				<input type="text" id="addressInput" class="address-input" value="{{CURRENT_PATH}}"
					onkeydown="handleAddressInputKeyDown(event)">
			</div>

			<div class="file-list-container" id="fileList" style="margin-bottom: 60px;">
			</div>

			<div class="footer">
				<div id="pinButton" class="pin-container" onclick="togglePin()">
					<div class="pin-box {{PIN_CLASS}}">
						<span class="pin-text">长驻</span>
						<span class="pin-checkbox">{{PIN_CHECKBOX}}</span>
					</div>
				</div>
				<div class="filename-input-container">
					<input type="text" id="filenameInput" class="filename-input"
						onkeydown="handleFilenameInputKeyDown(event)">
				</div>
				<div style="display: flex; gap: 15px;">
					<button class="button save-button" onclick="saveFile()" title="新建文件">
						<svg width="20" height="20" viewBox="0 0 24 24" fill="#fdf6e3">
							<path
								d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z" />
						</svg>
					</button>
					<button class="button cancel-button" onclick="createFolder()" title="新建文件夹">
						<svg width="20" height="20" viewBox="0 0 24 24" fill="#657b83">
							<path
								d="M10,4H4C2.89,4 2,4.89 2,6V20A2,2 0 0,0 4,22H20A2,2 0 0,0 22,20V8L16,2H10M13,9V3.5L18.5,9H13Z" />
						</svg>
					</button>
				</div>
			</div>
		</div>
	</div>

	<div id="emptyContextMenu" class="context-menu-empty">
		<div class="context-menu-empty-item {{SIZE_MODE_NONE_CLASS}}" data-mode="none"
			onclick="setSizeMode('none');refreshSizeDisplay();">none</div>
		<div class="context-menu-empty-item {{SIZE_MODE_M_CLASS}}" data-mode="m"
			onclick="setSizeMode('m');refreshSizeDisplay();">m</div>
		<div class="context-menu-empty-item {{SIZE_MODE_K_CLASS}}" data-mode="k"
			onclick="setSizeMode('k');refreshSizeDisplay();">k</div>
		<div class="context-menu-empty-item {{SIZE_MODE_B_CLASS}}" data-mode="b"
			onclick="setSizeMode('b');refreshSizeDisplay();">b</div>
	</div>

	<div id="itemContextMenu" class="context-menu">
		<div class="context-menu-item" data-action="rename" data-shortcut="q">
			<span>rename</span>
			<span class="context-menu-shortcut">= "q"</span>
		</div>
		<div class="context-menu-item" data-action="open" data-shortcut="w">
			<span>open</span>
			<span class="context-menu-shortcut">= "w"</span>
		</div>
		<div class="context-menu-item" data-action="delete" data-shortcut="s">
			<span>delete</span>
			<span class="context-menu-shortcut">= "s"</span>
		</div>
		<div class="context-menu-item" data-action="kode" data-shortcut="e">
			<span>kode</span>
			<span class="context-menu-shortcut">= "e"</span>
		</div>
	</div>
	<script>
		{{INLINE_SCRIPT}}
	</script>

</body>

</html>
