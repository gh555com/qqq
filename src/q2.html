<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="Content-Security-Policy"
		  content="default-src 'none'; script-src 'unsafe-inline' vscode-webview-resource:; style-src 'unsafe-inline' vscode-webview-resource:; img-src vscode-webview-resource: data:; font-src vscode-webview-resource:;">
	<title>qqq new 新建</title>
	<style>
		:root {
			--base03: #002b36;
			--base02: #073642;
			--base01: #586e75;
			--base00: #657b83;
			--base0: #839496;
			--base1: #93a1a1;
			--base2: #eee8d5;
			--base3: #fdf6e3;
			--yellow: #b58900;
			--orange: #cb4b16;
			--red: #dc322f;
			--magenta: #d33682;
			--violet: #6c71c4;
			--blue: #268bd2;
			--cyan: #2aa198;
			--green: #859900;

			--bg-color: var(--base3);
			--bg-highlight: var(--base2);
			--text-primary: var(--base00);
			--text-secondary: var(--base01);
			--text-dim: var(--base1);
			--border-color: var(--base2);
			--border-strong: var(--base1);
			--selection-bg: var(--orange);
			--selection-text: var(--base3);
			--button-primary: var(--blue);
			--button-text: var(--base3);

			--sidebar-resizer-width: 8px;
			--sz-area-width: 96px;
			--icon-area-width: 24px;

			--min-responsive-width: 240px;
			--min-tag-width: 170px;
		}

		* {
			box-sizing: border-box;
			forced-color-adjust: none;
			-ms-high-contrast-adjust: none;
		}

		body,
		.sidebar,
		.ky-content,
		.file-list-container,
		.file-item,
		.sz-area,
		.file-select-area,
		.folder-name-area,
		.file-name-area,
		.recent-item,
		.recycle-item,
		.nav-item,
		.context-menu-item,
		.context-menu-empty-item,
		.address-bar {
			-webkit-user-select: none;
			-moz-user-select: none;
			-ms-user-select: none;
			user-select: none;
		}

		input,
		textarea {
			-webkit-user-select: text;
			-moz-user-select: text;
			-ms-user-select: text;
			user-select: text;
		}

		.custom-ellipsis {
			display: inline-block;
			position: relative;
			vertical-align: bottom;
			margin: 0 2px;
		}

		.custom-ellipsis::after {
			content: '...';
			position: relative;
			top: 2px;
		}

		html,
		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
			margin: 0;
			padding: 0;
			height: 100%;
			width: 100%;
			background-color: var(--bg-color);
			color: var(--text-primary);
		}

		body {
			display: flex;
			flex-direction: column;
			border: none;
		}

		.container {
			display: flex;
			flex: 1;
			width: 100%;
			max-width: 100%;
			background-color: var(--bg-color);
			position: relative;
		}

		.sidebar {
			width: {{SIDEBAR_WIDTH}}px;
			background-color: var(--bg-color);
			border-right: none;
			display: flex;
			flex-direction: column;
			overflow-y: auto;
			flex-shrink: 0;
			position: fixed;
			left: 0;
			top: 0;
			bottom: 60px;
			z-index: 20;
			transition: width 0.2s ease;
		}

		.sidebar-resizer {
			width: var(--sidebar-resizer-width);
			background-color: var(--base2);
			position: fixed;
			left: {{SIDEBAR_WIDTH}}px;
			top: 0;
			bottom: 60px;
			z-index: 30;
			cursor: ew-resize;
			transition: background-color 0.2s, width 0.2s;
			border: none;
		}

		.sidebar-resizer:hover {
			background-color: var(--base1);
			width: calc(var(--sidebar-resizer-width) * 1.5);
		}

		.sidebar-resizer.active {
			background-color: var(--base00);
			width: calc(var(--sidebar-resizer-width) * 1.5);
		}

		.sidebar-header {
			padding: 0;
			height: 51px;
			background-color: #DEC987;
			color: var(--text-primary);
			display: flex;
			align-items: center;
			justify-content: center;
			border-bottom: none;
			cursor: pointer;
		}

		.sidebar-header:hover {
			background-color: #d4c079;
		}

		.sidebar-header .close-icon {
			font-size: 24px;
			line-height: 1;
		}

		.nav-item {
			padding: 8px 10px;
			border: none;
			background: none;
			width: 100%;
			text-align: left;
			font-size: 14px;
			color: var(--text-primary);
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.nav-item:hover {
			background-color: var(--bg-highlight);
		}

		.nav-item.active {
			background-color: var(--base1);
			color: var(--base3);
		}

		.empty-recycle-bin,
		.empty-recent-section {
			padding: 20px 10px;
			color: var(--text-dim);
			font-style: italic;
			text-align: center;
			font-size: 13px;
		}

		.ky-content {
			flex: 1;
			display: flex;
			flex-direction: column;
			overflow-y: auto;
			overflow-x: hidden;
			position: absolute;
			left: {{SIDEBAR_WIDTH}}px;
			right: 0;
			top: 0;
			bottom: 60px;
			transition: left 0.2s ease;
			background-color: var(--bg-color);
			padding: 0;
			margin: 0;
			border: none;
			min-height: 0;
		}

		.recent-section {
			padding: 0;
			background-color: var(--bg-color);
			position: static;
			z-index: 1;
			border: none;
			flex-shrink: 0;
		}

		.recent-header {
			font-weight: bold;
			margin-bottom: 2px;
			font-size: 13px;
			color: var(--text-secondary);
			padding: 10px;
		}

		.recent-list {
			display: flex;
			flex-direction: column;
			gap: {{LINE_SPACING}}px;
		}

		.recent-item {
			padding: 2px 8px;
			background-color: var(--bg-highlight);
			color: var(--text-primary);
			border-radius: 0;
			font-size: 12px;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			max-width: 100%;
			margin: 0;
			line-height: 1.2;
			display: flex;
			align-items: center;
			cursor: pointer;
			position: relative;
		}

		.recent-item:hover {
			background-color: #ddca88;
		}

		.delete-button {
			margin-right: 6px;
			padding: 0 4px;
			font-size: 10px;
			color: var(--text-dim);
			cursor: pointer;
			opacity: 0.6;
		}

		.recent-item:hover .delete-button {
			opacity: 1;
			color: var(--red);
		}

		.divider {
			height: 1px;
			background-color: var(--border-strong);
			margin: 8px 0;
		}

		.recycle-bin-section {
			padding: 0;
			margin: 0;
			border: none;
		}

		.recycle-bin-header {
			display: none;
		}

		.recycle-item {
			padding: 3px 10px;
			font-size: 11px;
			color: var(--text-dim);
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			cursor: pointer;
			width: 100%;
			box-sizing: border-box;
		}

		.recycle-item:hover {
			background-color: var(--bg-highlight);
			color: var(--text-primary);
		}

		.address-bar {
			padding: 0;
			background-color: var(--bg-color);
			position: static;
			z-index: 1;
			flex-shrink: 0;
			border: none;
		}

		.address-input {
			width: 100%;
			padding: 5px 5px 5px 22px;
			border: 1px solid var(--border-strong);
			border-radius: 3px;
			font-size: 14px;
			background-color: var(--bg-color);
			color: var(--text-primary);
			box-sizing: border-box;
		}

		.file-list-container {
			flex: 1;
			overflow: visible;
			overflow-x: auto;
			padding: 0 0 24px 0;
			scrollbar-width: thin;
			scrollbar-color: var(--base1) var(--base2);
			margin: 0;
			min-height: 0;
		}

		::selection {
			background: rgb(255, 211, 2) !important;
			color: black !important;
		}

		.ky-content::-webkit-scrollbar {
			width: 10px;
			height: 10px;
		}

		.ky-content::-webkit-scrollbar-track {
			background: var(--bg-highlight);
		}

		.ky-content::-webkit-scrollbar-thumb {
			background: var(--base1);
			border-radius: 5px;
		}

		.ky-content::-webkit-scrollbar-thumb:hover {
			background: var(--base00);
		}

		.file-item {
			padding: 0;
			border-radius: 0;
			display: flex;
			align-items: center;
			margin: {{LINE_SPACING}}px 0;
			min-height: 20px;
			line-height: 1.2;
			cursor: pointer;
			position: relative;
			overflow: hidden;
		}

		.file-item:hover {
			background-color: var(--bg-highlight) !important;
		}

		.file-item.selected {
			background-color: var(--selection-bg) !important;
			color: var(--selection-text);
		}

		.file-item.selected .sz-area,
		.file-item.selected .file-select-area,
		.file-item.selected .folder-name-area,
		.file-item.selected .file-name-area {
			background-color: transparent !important;
			color: var(--selection-text);
			padding-top: 2px;
			padding-bottom: 2px;
		}

		.file-item.selected .file-name-area {
			padding-top: 1px;
			padding-bottom: 1px;
		}

		.file-item.selected:hover {
			background-color: var(--selection-bg) !important;
		}

		.sz-area {
			width: var(--sz-area-width);
			height: 100%;
			min-height: 20px;
			font-style: italic;
			font-family: monospace;
			font-size: 12px;
			color: var(--text-dim);
			text-align: right;
			padding: 2px 0;
			line-height: 1.2;
			flex-shrink: 0;
			white-space: pre;
			cursor: pointer;
			z-index: 10;
			position: relative;
			display: inline-block;
			user-select: none;
			-webkit-user-select: none;
			-moz-user-select: none;
			-ms-user-select: none;
		}

		.file-select-area {
			display: flex;
			align-items: center;
			padding: 2px 4px 2px 8px;
			cursor: pointer;
			flex-shrink: 0;
			height: 100%;
		}

		.folder-name-area {
			flex: 1;
			padding: 2px 8px 2px 4px;
			cursor: pointer;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			height: 100%;
		}

		.file-name-area {
			flex: 1;
			padding: 2px 8px;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			height: 100%;
		}

		.file-icon {
			margin-right: 0;
			font-size: 16px;
		}

		.file-name {
			flex: 1;
		}

		.footer {
			position: fixed;
			bottom: 0;
			left: 0;
			right: 0;
			padding: 10px;
			background-color: var(--bg-color);
			border-top: 1px solid var(--border-strong);
			display: flex;
			justify-content: space-between;
			align-items: center;
			z-index: 10;
			box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.05);
			gap: 10px;
		}

		@media (max-width: var(--min-responsive-width)) {
			.pin-container {
				display: none;
			}

			.footer>div:last-child button:first-child {
				display: none;
			}

			.filename-input-container {
				flex: 1;
			}
		}

		@media (max-width: var(--min-tag-width)) {
			.filename-input-container {
				display: none;
			}
		}

		.filename-input-container {
			flex: 1;
			margin-right: 10px;
			position: relative;
		}

		.pin-container {
			margin-right: 37px;
			cursor: pointer;
			transform: translateX(12px) translateY(-1px);
		}

		.pin-box {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 5px;
			padding: 5px 23px;
			border-radius: 20px;
			background-color: var(--bg-highlight);
			transition: background-color 0.2s;
			width: 96px;
			color: var(--text-primary);
		}

		.pin-box:hover {
			background-color: #d3d1c4;
		}

		.pin-box.pinned {
			background-color: var(--yellow);
			color: var(--base3);
		}

		.pin-text {
			font-size: 16px;
			font-weight: 500;
			min-width: 40px;
			display: inline-block;
			text-align: center;
		}

		.pin-checkbox {
			font-size: 15px;
			font-family: monospace;
			min-width: 20px;
			display: inline-block;
			text-align: center;
		}

		.filename-input {
			width: 100%;
			padding: 5px 5px 5px 6px;
			border: 1px solid var(--border-strong);
			border-radius: 3px;
			font-size: 14px;
			background-color: var(--bg-color);
			color: var(--text-primary);
		}

		.filename-label {
			font-size: 13px;
			color: var(--text-secondary);
			margin-bottom: 3px;
			display: block;
		}

		.button {
			padding: 6px 12px;
			border: none;
			border-radius: 3px;
			font-size: 14px;
			cursor: pointer;
		}

		.save-button {
			background-color: var(--button-primary);
			color: var(--button-text);
		}

		.cancel-button {
			background-color: var(--bg-highlight);
			color: var(--text-primary);
			margin-left: 5px;
		}

		.context-menu {
			position: fixed;
			background-color: var(--bg-color);
			border: 1px solid var(--border-strong);
			box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
			z-index: 9999;
			padding: 4px 0;
			min-width: 150px;
			display: none;
			flex-direction: column;
		}

		.context-menu-item {
			display: flex;
			justify-content: space-between;
			align-items: center;
			padding: 6px 12px;
			cursor: pointer;
			font-size: 13px;
			white-space: nowrap;
			color: var(--text-primary);
		}

		.context-menu-item:hover {
			background-color: var(--bg-highlight);
		}

		.context-menu-shortcut {
			color: var(--text-dim);
			font-size: 12px;
			margin-left: 20px;
		}

		.context-menu-empty {
			position: fixed;
			background-color: var(--bg-color);
			border: 1px solid var(--border-strong);
			box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
			z-index: 9999;
			padding: 4px 0;
			min-width: 120px;
			display: none;
			flex-direction: column;
		}

		.context-menu-empty-item {
			padding: 6px 12px;
			cursor: pointer;
			font-size: 13px;
			white-space: nowrap;
			color: var(--text-primary);
		}

		.context-menu-empty-item:hover {
			background-color: var(--bg-highlight);
		}

		.context-menu-empty-item.selected {
			font-weight: bold;
			background-color: var(--base1);
			color: var(--base3);
		}

		.recent-section {
			flex-shrink: 0;
		}

		.address-bar {
			flex-shrink: 0;
		}

		.file-list-container {
			flex: 1 1 auto;
		}

		.path-tooltip {
			position: fixed;
			z-index: 99999;
			max-width: 600px;
			background-color: var(--bg-highlight);
			color: var(--text-primary);
			border: 1px solid var(--border-strong);
			border-radius: 3px;
			padding: 4px 8px;
			font-size: 12px;
			white-space: pre-wrap;
			box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
			pointer-events: none;
		}
	</style>
</head>

<body>
	<div class="container">
		<div class="sidebar">
			<div class="sidebar-header" onclick="cancel()" title="关闭当前面板">
				<span class="close-icon">✕</span>
			</div>
			{{DRIVES_HTML}}

			{{RECYCLE_BIN_HTML}}
		</div>

		<div class="sidebar-resizer" id="sidebarResizer"></div>

		<div class="ky-content" id="kyContent">
			<div class="recent-section">
				<div class="recent-list">
					{{RECENT_DIRS_HTML}}
				</div>
			</div>

			<div class="address-bar">
				<input type="text" id="addressInput" class="address-input" value="{{CURRENT_PATH}}">
			</div>

			<div class="file-list-container" id="fileList" style="margin: 0;">
			</div>

			<div class="footer">
				<div id="pinButton" class="pin-container" onclick="togglePin()">
					<div class="pin-box {{PIN_CLASS}}">
						<span class="pin-text">长驻</span>
						<span class="pin-checkbox">{{PIN_CHECKBOX}}</span>
					</div>
				</div>
				<div class="filename-input-container">
					<input type="text" id="filenameInput" class="filename-input">
				</div>
				<div style="display: flex; gap: 15px;">
					<button class="button save-button" onclick="saveFile()" title="新建文件">
						<svg width="20" height="20" viewBox="0 0 24 24" fill="#fdf6e3">
							<path
								d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z" />
						</svg>
					</button>
					<button class="button cancel-button" onclick="createFolder()" title="新建文件夹">
						<svg width="20" height="20" viewBox="0 0 24 24" fill="#657b83">
							<path
								d="M10,4H4C2.89,4 2,4.89 2,6V20A2,2 0 0,0 4,22H20A2,2 0 0,0 22,20V8L16,2H10M13,9V3.5L18.5,9H13Z" />
						</svg>
					</button>
				</div>
			</div>
		</div>
	</div>

	<div id="emptyContextMenu" class="context-menu-empty">
		<div class="context-menu-empty-item {{SIZE_MODE_NONE_CLASS}}" data-mode="none"
			 onclick="setSizeMode('none');refreshSizeDisplay();">none</div>
		<div class="context-menu-empty-item {{SIZE_MODE_M_CLASS}}" data-mode="m"
			 onclick="setSizeMode('m');refreshSizeDisplay();">m</div>
		<div class="context-menu-empty-item {{SIZE_MODE_K_CLASS}}" data-mode="k"
			 onclick="setSizeMode('k');refreshSizeDisplay();">k</div>
		<div class="context-menu-empty-item {{SIZE_MODE_B_CLASS}}" data-mode="b"
			 onclick="setSizeMode('b');refreshSizeDisplay();">b</div>
	</div>

	<div id="itemContextMenu" class="context-menu">
		<div class="context-menu-item" data-action="code" data-shortcut="q">
			<span>code</span>
			<span class="context-menu-shortcut">= "q"</span>
		</div>
		<div class="context-menu-item" data-action="open" data-shortcut="w">
			<span>open</span>
			<span class="context-menu-shortcut">= "w"</span>
		</div>
		<div class="context-menu-item" data-action="delete" data-shortcut="d">
			<span>delete</span>
			<span class="context-menu-shortcut">= "d"</span>
		</div>
		<div class="context-menu-item" data-action="rename" data-shortcut="e">
			<span>rename</span>
			<span class="context-menu-shortcut">= "e"</span>
		</div>
	</div>
	<script>
		{{INLINE_SCRIPT}}
	</script>

</body>

</html>
