<!--
    这是一个备用的 HTML 模板文件，如果将来需要从 TreeView 切换回 WebView 版本，
    可以使用此模板。当前版本使用 TreeView 实现侧边栏状态显示。
-->

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>qqq 状态面板</title>
    <style>
        body {
            font-family: var(--vscode-font-family);
            font-size: var(--vscode-font-size);
            color: var(--vscode-foreground);
            background-color: var(--vscode-sideBar-background);
            padding: 10px;
            margin: 0;
        }

        .status-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .status-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 4px;
            background-color: var(--vscode-sideBarSectionHeader-background);
            border: 1px solid var(--vscode-sideBarSectionHeader-border);
        }

        .status-icon {
            margin-right: 8px;
            font-size: 16px;
            width: 20px;
            text-align: center;
        }

        .status-content {
            flex: 1;
        }

        .status-label {
            font-weight: 500;
            margin-bottom: 2px;
        }

        .status-description {
            font-size: 12px;
            color: var(--vscode-descriptionForeground);
        }

        .divider {
            height: 1px;
            background-color: var(--vscode-sideBarSectionHeader-border);
            margin: 8px 0;
        }

        .action-button {
            width: 100%;
            padding: 8px 12px;
            margin: 4px 0;
            border: 1px solid var(--vscode-button-border);
            border-radius: 4px;
            background-color: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
            cursor: pointer;
            text-align: left;
            font-family: inherit;
            font-size: inherit;
        }

        .action-button:hover {
            background-color: var(--vscode-button-hoverBackground);
        }
    </style>
</head>
<body>
    <div class="status-container">
        <!-- 状态项将通过 JavaScript 动态插入 -->
        <div id="status-items"></div>

        <div class="divider"></div>

        <button class="action-button" onclick="openSettings()">
            ⚙️ 打开所有设置
        </button>

        <button class="action-button" onclick="refreshData()">
            🔄 刷新数据
        </button>
    </div>

    <script>
        const vscode = acquireVsCodeApi();

        function openSettings() {
            vscode.postMessage({ command: 'openSettings' });
        }

        function refreshData() {
            vscode.postMessage({ command: 'refresh' });
        }

        // 接收来自扩展的消息
        window.addEventListener('message', event => {
            const message = event.data;
            switch (message.command) {
                case 'updateStatus':
                    updateStatusItems(message.data);
                    break;
            }
        });

        function updateStatusItems(data) {
            const container = document.getElementById('status-items');
            container.innerHTML = '';

            data.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'status-item';
                itemDiv.innerHTML = `
                    <div class="status-icon">${item.icon}</div>
                    <div class="status-content">
                        <div class="status-label">${item.label}</div>
                        <div class="status-description">${item.description}</div>
                    </div>
                `;
                container.appendChild(itemDiv);
            });
        }
    </script>
</body>
</html>
